# MONO 社区 · Nginx 共享的代理规则
# ============================================================
# 被 80（HTTP）与 443（HTTPS）两个 server 块共同 include，
# 避免同一套 location 写两遍、改一处漏一处。
#
# ⚠️ 修改后必须 nginx -t 校验再 reload。
# ============================================================

# ---- 静态资源：由 Nginx 直接返回，不经过 Python ----
location /static/ {
    # 用 root 而不是 alias：alias 下 gzip 模块取文件路径有坑，
    # 表现为响应带 Vary/弱 ETag 却没有 Content-Encoding，压缩静默失效。
    root /opt/mono/app;
    # expires 和 add_header 会各产出一个 Cache-Control，重复头语义不明。
    # 统一走 map 决定的单一值：带 ?v= 的 1 年 immutable，其余 7 天。
    add_header Cache-Control $static_cache_cc;
    access_log off;
    gzip_static on;
}

# ---- 头像：来自数据目录，单独一条（前缀更长，优先匹配）----
location /static/avatars/ {
    alias /opt/mono/app/static/avatars/;
    expires 1d;
    access_log off;
}

# ---- 音乐流：必须支持 Range（拖动进度条/续播定位依赖它），且不做缓冲 ----
# ---- 音频流：必须流式下传 + 免限流 ----
# 前端实际用的是 /music/audio/（music.html 与 music_shell.html 都是），
# 之前只配了 /music/stream/，那条路径没命中 → 落到通用 location /上。
# 通用 location 有两处会让播放器卡在「缓冲中」：
#   ① proxy_buffering 默认 on → 音频被整体缓冲，不是流式下传
#   ② limit_req rate=50r/s → 播放时连续 Range 请求会触发 429，缓冲永远填不满
# 所以两条路径都要覆盖，且都不能限流。
location ~ ^/music/(stream|audio)/ {
    proxy_pass http://mono_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;

    # 音频必须边收边播，缓存会导致播放器一直等
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    chunked_transfer_encoding on;

    # 长音频中途可能长时间无数据，超时放宽
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log off;
}

# ---- 音频文件内网直发（sendfile）----
# Python 只做鉴权并回一个 X-Accel-Redirect 头，字节传输由这一段完成。
# 好处：Flask 的 worker 线程完全不参与数据传输，2 核机器上多人同时听歌不会打满。
# alias 指向真实目录；$uri 前缀去掉剩下的就是文件名。
location /music-files/ {
    internal;
    alias /opt/mono/app/music/;
    sendfile on;
    tcp_nopush on;
    aio threads;
    add_header Cache-Control "public, max-age=86400";
}

# ---- Socket.IO：长轮询/WebSocket，不能缓冲，超时要放宽 ----
location /socket.io/ {
    proxy_pass http://mono_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}

# ---- 存活探针：不打日志，便于外部监控高频探测 ----
location = /healthz {
    proxy_pass http://mono_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
}

# ---- 常见扫描/探测路径：直接 404，不进应用 ----
# 灰云直连后源站 IP 公开，各种扫描器会挨个试 /.env、/wp-admin、
# /config.js 这类路径。经 Cloudflare 时边缘会挡掉一部分，
# 现在得自己来。返回 404 而不是 403：不给探测者「存在」的信号。
# ⚠️ nginx 的 location 不允许跨行，正则必须写在一行里
location ~* "^/(?:\.env|\.git|\.svn|\.DS_Store|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|adminer|config\.(?:js|json)|payment-config|vendor/phpunit|actuator|server-status)(?:/|$)" { return 404; }

# ---- 其余请求：转发给应用，并在此层限流 ----
location / {
    limit_req zone=mono_req burst=100 nodelay;
    limit_req_status 429;

    proxy_pass http://mono_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
