{% block xqm_content %}
<div id="xqmCdxHome">

    <a class="xqm-btn xqm-btn-o xqm-btn-sm" href="{{ url_for('xqmaster_page') }}">← 返回</a>

    </div>
  </div>
</div>

  var homeEl = document.getElementById('xqmCdxHome');
  var detEl = document.getElementById('xqmCdxDetail');
  var cur = null;
  var GROW = null;
  var LT_BAL = 0, LT_COST = 10;

  function ltRender(){
    var bal = document.getElementById('xqmLtBal');
    if(bal) bal.textContent = '弈铢 ' + LT_BAL;
  }

  function ltOdds(r){
    var el = document.getElementById('xqmLtOdds');
    if(!el || !r || !r.lottery) return;
    var g = r.lottery.grades.map(function(x){ return X.GRADE[x.grade].zh + ' ' + x.weight + '%'; }).join(' · ');
    var a = r.lottery.amounts.map(function(x){ return x.count + '枚 ' + x.weight + '%'; }).join(' · ');
    el.textContent = g + ' ｜ 数量：' + a;
  }

  X.api('/api/xqm/grow').then(function(r){
    if(r && r.ok){
      GROW = {};
      r.pieces.forEach(function(p){ GROW[p.type] = p; });
      GROW.max = r.max_level;
      LT_BAL = r.balance || 0;
      LT_COST = r.cost || 10;
      ltOdds(r);
      ltRender();
      renderGrid();
      if(cur) fillDetail(cur);
    }
  }).catch(function(){});

  function blank(){
    var b = [];
    for(var r=0;r<10;r++){ var row=[]; for(var c=0;c<9;c++) row.push(null); b.push(row); }
    return b;
  }
  function mk(board,t,s,r,c,ov){
    var d = X.PD[t];
    ov = ov || {};
    var p = {t:t, s:s, hp:ov.hp || d.hp, mh:d.hp, atk:d.atk,
             id:t+'-'+s+'-'+r+'-'+c, mv:false, g2:!!ov.g2};
    if(ov.mv) p.mv = true;              /* 骑·冲阵：演示「本回合移动过」 */
    if(ov.cl) p.cl = 1;                 /* 龙·腾云 */
    if(ov.sh) p.sh = ov.sh;             /* 医·妙手的护盾 */
    if(ov.kb) p.kb = ov.kb;             /* 虎·百兽的连杀层数 */
    if(ov.ch) p.ch = 1;                 /* 蓄·蓄势：演示「已蓄力」 */
    if(ov.sd) p.sd = 1;                 /* 卫·替死：演示「已经替过一次」 */
    if(ov.rev) p.rev = 1;               /* 残·残兵：演示「已经复活过」 */
    if(ov.mk !== undefined){            /* 标·标记 */
      p.mk = ov.mk; p.mks = ov.mks;
    }
    if(ov.dbf !== undefined){           /* 仕·死卫 / 鞭·铁鞭的降攻 */
      p.dbf = ov.dbf; p.dbfv = ov.dbfv; p.dbfn = ov.dbfn;
    }
    board[r][c] = p;
  }
  function fill(board, list){
    list.forEach(function(q){ mk(board, q[0], q[1], q[2], q[3], q[4]); });
    return board;
  }
  function nm(p){ return X.GLYPH[p.t][p.s==='red'?0:1]; }

  var GRADE_ORDER = ['mythic', 'legend', 'epic', 'rare', 'common'];

  /* 棋子状态分类（图鉴排序 + 角标共用）
     0 可解锁 · 1 可升级 · 2 已有 · 3 未拥有 */
  var CAT_NAME = ['可解锁', '可升级', '已有', '未拥有'];
  function catOf(t){
    var g = GROW ? GROW[t] : null;
    if(!g) return 3;
    var locked = !!g.locked, maxed = !!g.maxed;
    var have = g.shards || 0, need = locked ? (g.unlock_cost || 30) : (g.cost || 0);
    if(locked) return have >= need ? 0 : 3;
    if(maxed)  return 2;
    return have >= need ? 1 : 2;
  }

  function cardHTML(t){
    var d = X.PD[t], g = GROW ? GROW[t] : null;
    var hp = g ? g.hp : d.hp, atk = g ? g.atk : d.atk;
    var gd = X.GRADE[d.grade] || {};
    var locked = g ? !!g.locked : false;
    var sh = '', pb = '';
    if(g){
      var need = locked ? (g.unlock_cost || 30) : g.cost;
      var have = g.shards || 0;
      var pct  = need > 0 ? Math.min(100, Math.round(have / need * 100)) : 100;
      if(locked && have >= need)      pct = 100;
      if(!locked && g.maxed)          pct = 100;
      if(locked) sh = '<span class="sh lk">需 ' + need + ' 碎片解锁 · 现有 ' + have + '</span>';
      else if(g.maxed) sh = '<span class="sh">Lv '+g.level+' · 已满级</span>';
      else sh = '<span class="sh">Lv '+g.level+' · 碎片 '+have+'/'+need+'</span>';
      // 进度条：未解锁显示解锁进度，已拥有显示升级进度
      pb = '<span class="pb'+(pct>=100?' full':'')+'"><i style="width:'+pct+'%"></i></span>'
         + '<span class="pbt">'+(locked ? '解锁进度 ' : (g.maxed ? '已满级 ' : '升级进度 '))
         + have + '/' + need + ' · ' + pct + '%</span>';
    }
    return '<button class="xqm-cdx-card' + (locked ? ' lk' : '') + '" data-t="'+t+'"'
      + ' style="--gc:'+gd.c+';--gc-bg:'+gd.c+'14;--gc-bd:'+gd.c+'55">'
      + '<span class="badge" style="color:'+gd.c+';border-color:'+gd.c+'66;background:'+gd.c+'22">'+(gd.zh||'')+'</span>'
      + (locked ? '<span class="lock" title="未解锁">🔒</span>' : '')
      + '<span class="tagcat c' + catOf(t) + '">' + CAT_NAME[catOf(t)] + '</span>'
      + X.pcHTML({t:t, s:'red', hp:hp, mh:hp, id:'cdxg-'+t, lv:g?g.level:1}, {})
      + '<span class="nm">'+d.name+'</span>'
      + '<span class="st">生命 '+hp+' · 攻击 '+atk+'</span>'
      + sh
      + pb
      + '</button>';
  }

  function renderGrid(){
    var host = document.getElementById('xqmCdxGrid');
    /* 排序规则：先按「能不能马上操作」分类，类内按**品质**降序。
       ⚠️ 这里的「等级」指的是品质（神话 > 传说 > 卓越 > 优良 > 普通），
       不是棋子的 Lv 1~20 —— 品质相同才再比 Lv。 */
    var all = X.ORDER.slice().sort(function(a, b){
      var ca = catOf(a), cb = catOf(b);
      if(ca !== cb) return ca - cb;
      var ga = GRADE_ORDER.indexOf(X.PD[a].grade);
      var gb = GRADE_ORDER.indexOf(X.PD[b].grade);
      if(ga !== gb) return ga - gb;      // GRADE_ORDER 本身就是从高到低
      var la = (GROW && GROW[a] && GROW[a].level) || 0;
      var lb = (GROW && GROW[b] && GROW[b].level) || 0;
      if(la !== lb) return lb - la;      // 同品质再按棋子等级降序
      return X.ORDER.indexOf(a) - X.ORDER.indexOf(b);
    });
    host.innerHTML = all.length
      ? '<div class="xqm-cdx-grid">' + all.map(cardHTML).join('') + '</div>'
      : '<div class="xqm-cdx-empty">敬请期待 · 后续养成版本开放</div>';
  }

  function mbHTML(win, board, opt){
    opt = opt || {};
    var rows = win.r1-win.r0+1, cols = win.c1-win.c0+1;
    var h = '<div class="xqm-mb"><div class="xqm-mb-grid" style="grid-template-columns:repeat('+cols+',auto)">';
    for(var r=win.r0;r<=win.r1;r++){
      for(var c=win.c0;c<=win.c1;c++){
        var cls = 'xqm-cell'+(r===win.r1?' nc':'')+(c===win.c1?' nr':'');
        h += '<div class="'+cls+'" data-r="'+r+'" data-c="'+c+'">';
        var p = board[r][c];
        if(p) h += X.pcHTML(p, {sel: opt.sel===p.id});
        if(opt.hl && opt.hl[r+','+c]) h += '<div class="xqm-hl '+opt.hl[r+','+c]+'"></div>';
        if(opt.aura && opt.aura[r+','+c]) h += '<div class="xqm-hl aura"></div>';
        if(opt.hot && opt.hot[r+','+c]) h += '<div class="xqm-hot"></div>';
        if(opt.nums) for(var i=0;i<opt.nums.length;i++){
          var n = opt.nums[i];
          if(n.r===r && n.c===c){
            h += (opt.plus || n.plus)
              ? '<div class="xqm-mbdmg" style="color:#3B9A5F">+'+n.v+'</div>'
              : '<div class="xqm-mbdmg">-'+n.v+'</div>';
          }
        }
        h += '</div>';
      }
    }
    return h + '</div></div>';
  }

  function auraOf(board, r, c, side){
    var o = {};
    for(var dr=-1;dr<=1;dr++) for(var dc=-1;dc<=1;dc++){
      if(!dr && !dc) continue;
      var q = X.at(board, r+dr, c+dc);
      if(q && q.s===side) o[(r+dr)+','+(c+dc)] = 1;
    }
    return o;
  }

  function moveEngine(host, scene){
    var board, sel=null, hl={}, nums=[], msg='';

    function reset(){
      board = fill(blank(), scene.pieces);
      sel=null; hl={}; nums=[]; msg=''; paint();
    }
    function paint(){
      var hot = {};
      if(!sel) hot[scene.focus[0]+','+scene.focus[1]] = 1;
      var hint = scene.hint || '点一下棋盘上闪着的棋子，绿格可行，金格可击。';
      if(sel){
        var canHeal = false;
        for(var hk in hl){ if(hl[hk] === 'heal'){ canHeal = true; break; } }
        hint += canHeal ? '　绿色格走过去，金色格打一下，绿圈圈住的是可以治疗的友军。'
                        : '　绿色格走过去，金色格打一下。';
      }
      host.innerHTML =
        '<div class="hint">' + hint + '</div>'
        + '<div class="body">' + mbHTML(scene.win, board, {
            sel: sel ? board[sel[0]][sel[1]].id : '', hl: hl, hot: hot, nums: nums })
        + '<div class="res">' + (msg || '<span class="dim">尚未出手</span>') + '</div></div>'
        + '<div class="tools"><button class="tool" data-reset="1">重置</button></div>';
    }
    function hitText(res){
      return '<div class="big">-' + res.hits[0].v + '</div>'
        + res.notes.map(function(n){ return '<span class="note">' + n + '</span>'; }).join('')
        + res.hits.map(function(h){
            return '<span class="ln">' + nm(h.who) + ' 掉 <b>' + h.v + '</b></span>';
          }).join('');
    }

    host.onclick = function(e){
      if(e.target.closest('[data-reset]')){ reset(); return; }
      var cell = e.target.closest('.xqm-cell');
      if(!cell) return;
      var r = +cell.dataset.r, c = +cell.dataset.c, p = board[r][c];

      /* 已经选中了医，点相邻友军 = 治疗 */
      if(sel && hl[r+','+c] === 'heal' && p){
        var healer = board[sel[0]][sel[1]];
        var hp = X.healPreview(healer, p);
        p.hp += hp.heal;
        if(hp.shield) p.sh = (p.sh || 0) + hp.shield;
        nums = [{r:r, c:c, v:hp.heal, plus:true}];
        if(hp.shield) nums.push({r:r, c:c, v:hp.shield, plus:true});
        msg = '<div class="big">+' + hp.heal + '</div>'
          + '<span class="note">回春 · 回复 ' + hp.heal + ' 点</span>'
          + (hp.shield ? '<span class="ln">妙手 · 溢出的 <b>' + hp.shield + '</b> 点转为护盾</span>' : '');
        sel = null; hl = {}; paint(); return;
      }

      if(p && p.s===scene.ally){
        sel = [r,c]; nums = []; msg = '';
        var tg = X.targetsOf(board, r, c);
        hl = {};
        for(var k in tg.mv) hl[k] = 'mv';
        for(var k in tg.rng) hl[k] = hl[k] ? 'both' : 'rng';
        for(var k2 in tg.heal) hl[k2] = 'heal';
        paint(); return;
      }
      if(sel && hl[r+','+c]){
        var a = board[sel[0]][sel[1]];
        if(p && p.s!==scene.ally){
          var res = X.resolveAttack(board, sel[0], sel[1], r, c);
          nums = res.hits.slice();
          res.hits.forEach(function(h){
            var q = board[h.r][h.c];
            if(!q) return;
            q.hp = Math.max(0, q.hp - h.v);
            if(q.hp<=0) board[h.r][h.c] = null;
          });
          msg = hitText(res);
          a.mv = false;
        } else {
          board[r][c] = a; board[sel[0]][sel[1]] = null; a.mv = true;
          nums = [];
          msg = '走到 (' + r + ',' + c + ')' + (scene.charge
            ? ' —— 本回合已经移动过，接下来打人会多两成伤害' : '');
        }
        sel = null; hl = {}; paint(); return;
      }
      sel = null; hl = {}; paint();
    };
    reset();
  }

  function traitEngine(host, cfg){
    var board, msg='', nums=[], hot={}, aura={};

    function reset(){
      board = fill(blank(), cfg.pieces);
      msg=''; nums=[]; hot={}; aura={};
      cfg.targets.forEach(function(t){ hot[t[0]+','+t[1]] = 1; });
      if(cfg.aura === 'palace'){
        for(var r=7;r<=9;r++) for(var c=3;c<=5;c++) aura[r+','+c] = 1;
      } else if(cfg.aura) aura = auraOf(board, cfg.aura[0], cfg.aura[1], 'red');
      paint();
    }
    function paint(){
      host.innerHTML =
        '<div class="hint">' + cfg.hint + '</div>'
        + '<div class="body">' + mbHTML(cfg.win, board, {hl:{}, hot:hot, aura:aura, nums:nums})
        + '<div class="res">' + (msg || '<span class="dim">点闪着的棋子看伤害</span>') + '</div></div>'
        + '<div class="tools"><button class="tool" data-reset="1">重置</button></div>';
    }

    host.onclick = function(e){
      if(e.target.closest('[data-reset]')){ reset(); return; }
      var cell = e.target.closest('.xqm-cell');
      if(!cell) return;
      var r = +cell.dataset.r, c = +cell.dataset.c, spec = null;
      cfg.targets.forEach(function(t){ if(t[0]===r && t[1]===c) spec = t; });
      if(!spec){ X.toast(__('点闪着的棋子')); return; }
      var res = X.resolveAttack(board, spec[2][0], spec[2][1], r, c);
      if(!res) return;
      nums = res.hits.slice();
      msg = '<div class="big">-' + res.hits[0].v + '</div>'
        + res.notes.map(function(n){ return '<span class="note">' + n + '</span>'; }).join('')
        + res.hits.map(function(h){
            return '<span class="ln">' + nm(h.who) + ' 掉 <b>' + h.v + '</b></span>';
          }).join('');
      paint();
    };
    reset();
  }

  /* 静态标注板：光环 / 被动 / 回合末这类没有「出手」的特性，用高亮 + 说明讲清楚 */
  function staticScene(host, cfg){
    var board = fill(blank(), cfg.pieces);
    var hl = cfg.hl || {}, aura = cfg.aura || {};
    if(cfg.scout){          /* 斥的侦察：把敌方所有攻击范围标出来 */
      for(var r=0;r<10;r++) for(var c=0;c<9;c++){
        var p = board[r][c];
        if(!p || p.s === cfg.ally) continue;
        var tg = X.targetsOf(board, r, c);
        for(var k in tg.rng) hl[k] = 'rng';
      }
    }
    host.innerHTML =
      '<div class="hint">' + cfg.hint + '</div>'
      + '<div class="body">' + mbHTML(cfg.win, board, {hl:hl, aura:aura})
      + '<div class="res">' + (cfg.text || '<span class="dim">看图即可</span>') + '</div></div>'
      + '<div class="tools"><button class="tool" data-reset="1">重置</button></div>';
    host.onclick = function(){};
  }

  /* 阵亡触发：点一下那个棋子，让它倒下，看友军回复多少 */
  function deathScene(host, cfg){
    var board, msg='', nums=[], done=false;
    function hot(){
      var o = {};
      if(!done) o[cfg.death[0]+','+cfg.death[1]] = 1;
      return o;
    }
    function reset(){
      board = fill(blank(), cfg.pieces);
      msg=''; nums=[]; done=false; paint();
    }
    function paint(){
      host.innerHTML =
        '<div class="hint">' + cfg.hint + '</div>'
        + '<div class="body">' + mbHTML(cfg.win, board, {hot:hot(), nums:nums, plus:true})
        + '<div class="res">' + (msg || '<span class="dim">点闪着的棋子看触发</span>') + '</div></div>'
        + '<div class="tools"><button class="tool" data-reset="1">重置</button></div>';
    }
    host.onclick = function(e){
      if(e.target.closest('[data-reset]')){ reset(); return; }
      var cell = e.target.closest('.xqm-cell');
      if(!cell) return;
      var r = +cell.dataset.r, c = +cell.dataset.c;
      if(done || r !== cfg.death[0] || c !== cfg.death[1]){ X.toast(__('点闪着的棋子')); return; }
      var me = board[r][c];
      if(!me) return;
      done = true;
      board[r][c] = null;
      var healed = [];
      X.A8.forEach(function(o){
        var q = X.at(board, r+o[0], c+o[1]);
        if(q && q.s === me.s && q.hp < q.mh){
          var v = Math.min(cfg.near, q.mh - q.hp);
          if(v > 0){ q.hp += v; healed.push({r:r+o[0], c:c+o[1], v:v}); }
        }
      });
      if(cfg.all){
        for(var rr=0;rr<10;rr++) for(var cc=0;cc<9;cc++){
          var q2 = board[rr][cc];
          if(q2 && q2.s === me.s && q2.hp < q2.mh){
            var v2 = Math.min(cfg.allv, q2.mh - q2.hp);
            if(v2 > 0){ q2.hp += v2; healed.push({r:rr, c:cc, v:v2}); }
          }
        }
      }
      nums = healed;
      msg = '<div class="big">' + X.GLYPH[me.t][0] + ' 阵亡</div>'
        + (healed.length
            ? healed.map(function(h){
                return '<span class="ln">' + X.GLYPH[me.t][0] + ' 的友军回复 <b>+' + h.v + '</b></span>';
              }).join('')
            : '<span class="ln">周围没有受伤的友军</span>');
      paint();
    };
    reset();
  }

  /* 通用触发演示：点一下目标，看「击杀之后 / 治疗之后」会发生什么 */
  function triggerScene(host, cfg){
    var board, msg='', nums=[], done=false;
    function hot(){
      var o = {};
      if(!done) o[cfg.target[0]+','+cfg.target[1]] = 1;
      return o;
    }
    function reset(){ board = fill(blank(), cfg.pieces); msg=''; nums=[]; done=false; paint(); }
    function paint(){
      host.innerHTML =
        '<div class="hint">' + cfg.hint + '</div>'
        + '<div class="body">' + mbHTML(cfg.win, board, {hot:hot(), nums:nums, plus:cfg.mode==='heal'})
        + '<div class="res">' + (msg || '<span class="dim">点闪着的棋子</span>') + '</div></div>'
        + '<div class="tools"><button class="tool" data-reset="1">重置</button></div>';
    }
    host.onclick = function(e){
      if(e.target.closest('[data-reset]')){ reset(); return; }
      var cell = e.target.closest('.xqm-cell');
      if(!cell) return;
      var r = +cell.dataset.r, c = +cell.dataset.c;
      if(done || r !== cfg.target[0] || c !== cfg.target[1]){ X.toast(__('点闪着的棋子')); return; }
      var q = board[r][c];
      if(!q) return;
      if(cfg.mode === 'kill'){
        done = true;
        board[r][c] = null;
        msg = '<div class="big">' + X.GLYPH[q.t][0] + ' 阵亡</div>' + cfg.text;
      } else if(cfg.mode === 'strike'){
        /* 真打一下：算伤害 → 护盾 → 替死 → 复活/阵亡。用来演示「打完之后」。 */
        done = true;
        var sa = board[cfg.src[0]][cfg.src[1]];
        var res = X.resolveAttack(board, cfg.src[0], cfg.src[1], r, c);
        var h0 = (res && res.hits.length) ? res.hits[0] : null;
        var lines = [];
        if(h0 && h0.v > 0){
          var hr = h0.r, hc = h0.c, hq = board[hr][hc];
          nums.push({r:hr, c:hc, v:h0.v});
          if(hr !== r || hc !== c){
            lines.push('<span class="ln">' + X.GLYPH[hq.t][0] + ' 替死，替 '
              + X.GLYPH[q.t][0] + ' 挨了 <b>' + h0.v + '</b> 点</span>');
          } else {
            lines.push('<span class="ln">造成 <b>' + h0.v + '</b> 点伤害</span>');
          }
          if(cfg.lethal || h0.v >= hq.hp){
            if(hq.t === 'can' && !hq.rev){
              /* 残·残兵：一场一次，倒下时站起来 */
              hq.rev = 1;
              hq.hp = Math.max(1, Math.round(hq.mh * (hq.g2 ? 0.50 : 0.30)));
              lines.push('<span class="ln">残兵 · 以 <b>' + hq.hp + '</b> 点生命复活</span>');
            } else {
              board[hr][hc] = null;
              if(hq !== q) lines.push('<span class="ln">' + X.GLYPH[hq.t][0] + ' 阵亡</span>');
            }
          } else {
            hq.hp -= h0.v;
          }
        }
        msg = '<div class="big">' + X.GLYPH[q.t][0] + ' 挨打</div>'
            + lines.join('') + (cfg.text || '');
      } else {
        done = true;
        var src = board[cfg.src[0]][cfg.src[1]];
        var hp = X.healPreview(src, q);
        q.hp += hp.heal;
        if(hp.shield) q.sh = (q.sh || 0) + hp.shield;
        nums = [{r:r, c:c, v:hp.heal, plus:true}];
        if(hp.shield) nums.push({r:r, c:c, v:hp.shield, plus:true});
        msg = '<div class="big">+' + hp.heal + '</div>'
          + '<span class="note">回春 · 回复 ' + hp.heal + ' 点</span>'
          + (hp.shield ? '<span class="ln">妙手 · 溢出的 <b>' + hp.shield + '</b> 点转为护盾</span>' : '')
          + (cfg.text ? '<span class="ln">' + cfg.text + '</span>' : '');
      }
      paint();
    };
    reset();
  }

  function infoHTML(t){
    var d = X.PD[t], g = GROW ? GROW[t] : null;
    var hp = g ? g.hp : d.hp, atk = g ? g.atk : d.atk;
    var hpEm = g && g.hp > d.hp ? ' <em>+' + Math.round((g.hp/d.hp - 1)*100) + '%</em>' : '';
    var atkEm = g && g.atk > d.atk ? ' <em>+' + Math.round((g.atk/d.atk - 1)*100) + '%</em>' : '';
    return '<div class="xqm-cdx-head">'
      + X.pcHTML({t:t, s:'red', hp:hp, mh:hp, id:'cdx-'+t, lv:g?g.level:1}, {})
      + '<div><div class="nm">' + d.name + ' ' + X.gradeHTML(d.grade) + '</div>'
      + '<div class="sub">' + d.lore + '</div></div></div>'
      + '<div class="xqm-cdx-nums" style="grid-template-columns:repeat(2,1fr)">'
      + '<div class="s"><div class="k">生命</div><div class="v">' + hp + hpEm + '</div></div>'
      + '<div class="s"><div class="k">攻击</div><div class="v">' + atk + atkEm + '</div></div>'
      + '</div>'
      + growHTML(t)
      + '<div class="xqm-cdx-rows">'
      + '<div class="r"><span class="lb">移动</span><span class="vl">' + X.MV_DESC[t] + '</span></div>'
      + '<div class="r"><span class="lb">攻击</span><span class="vl">' + X.RNG_DESC[t] + '</span></div>'
      + '</div>';
  }

  function growHTML(t){
    if(!GROW || !GROW[t]) return '';
    var g = GROW[t];
    var pct = g.maxed ? 100 : Math.min(100, Math.round(g.shards / g.cost * 100));
    var h = '<div class="xqm-grow">'
      + '<div class="gh"><span>沙场磨砺 · 对局掉落碎片</span>'
      + '<span class="lv">Lv ' + g.level + '<span style="color:var(--muted);font-size:11px;font-weight:400"> / ' + GROW.max + '</span></span></div>'
      + '<div class="bar"><i style="width:' + pct + '%"></i></div>'
      + '<div class="gs">' + (g.maxed ? '碎片 ' + g.shards + ' · 已满级，坐镇全场'
        : '碎片 ' + g.shards + ' / ' + g.cost + '　·　下级：'
        + (g.level % 5 === 0 ? '特性增强' : (Math.floor((g.level-1)/2) % 2 === 0 ? '生命提升' : '攻击提升'))) + '</div>'
      + (g.locked
        ? '<button class="xqm-btn xqm-btn-p xqm-btn-sm up" data-up="'+t+'">解锁 · 消耗 '
          + (g.unlock_cost || 30) + ' 碎片</button>'
        : (g.maxed ? '<button class="xqm-btn xqm-btn-p xqm-btn-sm up" disabled>已满级</button>'
          : '<button class="xqm-btn xqm-btn-p xqm-btn-sm up" data-up="'+t+'">升级 · 消耗 ' + g.cost + ' 碎片</button>'))
      + '<div class="grows">'
      + '<div class="r"><span>生命</span><span>' + g.hp + '<em>+' + Math.round((g.hp/g.base_hp - 1)*100) + '%</em></span></div>'
      + '<div class="r"><span>攻击</span><span>' + g.atk + '<em>+' + Math.round((g.atk/g.base_atk - 1)*100) + '%</em></span></div>'
      + '<div class="r"><span>特性增强</span><span>' + (g.trait_bonus ? '+' + g.trait_bonus + '%' : '尚未开始') + '</span></div>'
      + '</div>'
      + '<div class="nt' + (g.lv20 ? '' : ' lock') + '"><b>Lv20 新特性 · ' + X.PD[t].nt.name + '</b> —— ' + X.PD[t].nt.desc
      + (g.lv20 ? '' : '（未解锁）') + '</div>'
      + '</div>';
    return h;
  }

  function showDemo(which){
    ['a','b','c'].forEach(function(k){
      document.getElementById('xqmDemo' + k.toUpperCase()).style.display = (k === which) ? '' : 'none';
    });
    var tabs = document.getElementById('xqmDemoTabs').children;
    for(var i=0;i<tabs.length;i++){
      tabs[i].classList.toggle('on', tabs[i].dataset.d === which);
    }
  }

  /* 一个场景该用哪个演示引擎：静态标注 > 阵亡触发 > 点一下触发 > 伤害结算 > 走子演示 */
  function mountScene(el, s){
    if(!s){ el.innerHTML = '<div class="hint">这个棋子还没有配演示</div>'; el.onclick = null; return; }
    if(s.static) staticScene(el, s);
    else if(s.death) deathScene(el, s);
    else if(s.trigger) triggerScene(el, s);
    else if(s.targets) traitEngine(el, s);
    else moveEngine(el, s);
  }

  function fillDetail(t){
    document.getElementById('xqmCdxInfo').innerHTML = infoHTML(t);
    var s = SCENES[t];
    if(!s){ X.toast(__('这个棋子的演示还在补')); return; }
    mountScene(document.getElementById('xqmDemoA'), s.a);
    mountScene(document.getElementById('xqmDemoB'), s.b);
    mountScene(document.getElementById('xqmDemoC'), s.c);
    document.getElementById('xqmDemoTabs').innerHTML =
      '<button class="xqm-demo-tab" data-d="a">移动 / 攻击</button>'
      + '<button class="xqm-demo-tab" data-d="b">特性 · ' + X.PD[t].trait + '</button>'
      + '<button class="xqm-demo-tab" data-d="c">特性 · ' + X.PD[t].nt.name + '</button>';
    showDemo('a');
  }

  function openDetail(t, push){
    cur = t;
    fillDetail(t);
    homeEl.style.display = 'none';
    detEl.style.display = '';
    if(push !== false) location.hash = t;
    window.scrollTo(0, 0);
  }

  function openHome(push){
    cur = null;
    homeEl.style.display = '';
    detEl.style.display = 'none';
    if(push !== false) history.pushState('', '', location.pathname + location.search);
    window.scrollTo(0, 0);
  }

  function fromHash(){
    var m = location.hash.match(/^#([a-z]+)$/);
    return (m && X.ORDER.indexOf(m[1]) >= 0) ? m[1] : null;
  }

  document.getElementById('xqmCdxGrid').onclick = function(e){
    var card = e.target.closest('.xqm-cdx-card');
    if(!card) return;
    openDetail(card.dataset.t);
  };

  document.getElementById('xqmCdxInfo').addEventListener('click', function(e){
    var btn = e.target.closest('[data-up]');
    if(!btn || btn.disabled) return;
    var t = btn.dataset.up;
    btn.disabled = true;
    X.api('/api/xqm/grow/upgrade', {method:'POST', body:{type:t}}).then(function(r){
      if(!r || !r.ok){
        X.toast((r && r.msg) || __('升级失败'));
        if(GROW && GROW[t]) fillDetail(cur);
        return;
      }
      GROW[t].level = r.level; GROW[t].shards = r.shards;
      GROW[t].locked = false;
      if(r.next_cost !== null && r.next_cost !== undefined) GROW[t].cost = r.next_cost;
      GROW[t].maxed = r.next_cost === null || r.next_cost === undefined;
      fillDetail(cur); renderGrid();
      if(r.unlocked) X.toast((r.msg || __('已解锁')) + __('，可以上阵了'));
      else if(r.just20) X.toast(__('Lv20！解锁新特性：') + r.nt_name);
      else X.toast(__('升级成功，Lv ') + r.level);
    }).catch(function(){ btn.disabled = false; X.toast(__('网络异常')); });
  });

  document.getElementById('xqmCdxBack').onclick = function(e){
    e.preventDefault();
    openHome();
  };

  document.getElementById('xqmDemoTabs').onclick = function(e){
    var tab = e.target.closest('.xqm-demo-tab');
    if(!tab) return;
    showDemo(tab.dataset.d);
  };

  window.addEventListener('hashchange', function(){
    var t = fromHash();
    if(t){ if(t !== cur) openDetail(t, false); }
    else if(cur !== null) openHome(false);
  });

  renderGrid();
  var t0 = fromHash();
  if(t0) openDetail(t0, false);
})();
</script>
{% endblock %}
