{% extends "base.html" %}
{% block title %}消息中心 - MONO 社区{% endblock %}
{% block content %}
<style>
  .ib-wrap{max-width:720px;margin:0 auto;}
  .ib-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 4px;}
  .ib-head h1{font-size:22px;font-weight:700;margin:0;}
  .ib-head .ib-total{font-size:13px;color:var(--muted);}
  .ib-sub{color:var(--muted);font-size:13px;margin:0 0 18px;}
  .ib-list{display:flex;flex-direction:column;gap:10px;}
  .ib-item{
    display:flex;align-items:center;gap:12px;padding:14px 16px;
    border:1px solid var(--line);border-radius:14px;background:var(--card);
    text-decoration:none;color:inherit;transition:border-color .15s,background .15s;
  }
  .ib-item:hover{border-color:var(--fg);}
  .ib-item.zero{opacity:.5;}
  .ib-ic{
    width:38px;height:38px;flex:0 0 38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--soft);font-size:18px;
  }
  .ib-main{flex:1;min-width:0;}
  .ib-name{font-size:15px;font-weight:600;}
  .ib-desc{font-size:12px;color:var(--muted);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ib-n{
    min-width:26px;height:22px;padding:0 8px;border-radius:11px;
    background:var(--fg);color:var(--bg);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .ib-n.zero{background:var(--soft);color:var(--muted);}
  .ib-empty{text-align:center;padding:52px 20px;color:var(--muted);}
  .ib-empty .big{font-size:34px;margin-bottom:10px;}
  .ib-hint{
    margin-top:20px;padding:12px 14px;border-radius:12px;
    background:var(--soft);font-size:12px;color:var(--muted);line-height:1.8;
  }
</style>

<div class="ib-wrap">
  <div class="ib-head">
    <h1>消息中心</h1>
    <span class="ib-total" id="ibTotal"></span>
  </div>
  <p class="ib-sub">所有未读都在这儿，点进去自动标记已读</p>

  <div class="ib-list" id="ibList">
    <div class="ib-empty">加载中…</div>
  </div>

  <div class="ib-hint">
    浏览器会定期自动检查新消息，页面开着的时候红点会自己亮起，不用手动刷新。
  </div>
</div>

<script>
(function(){
  var ICONS = { bell:'🔔', chat:'💬', user:'👥', reply:'↩️', at:'＠' };
  var DESC = {
    notification: '系统公告、活动通知与站内提醒',
    dm: '别人给你发的私信',
    friend: '有人申请加你为好友',
    reply: '有人回复了你的帖子或评论',
    mention: '有人在帖子里 @ 了你'
  };
  var list = document.getElementById('ibList');
  var totalEl = document.getElementById('ibTotal');

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function render(j){
    if (!j || !j.items) return;
    var total = j.total || 0;
    totalEl.textContent = total > 0 ? ('共 ' + total + ' 条未读') : '没有未读';
    var html = '';
    for (var i = 0; i < j.items.length; i++){
      var it = j.items[i];
      var n = it.count || 0;
      html += '<a class="ib-item' + (n ? '' : ' zero') + '" href="' + esc(it.link) + '">'
           + '<div class="ib-ic">' + (ICONS[it.icon] || '🔔') + '</div>'
           + '<div class="ib-main">'
           + '<div class="ib-name">' + esc(it.name) + '</div>'
           + '<div class="ib-desc">' + esc(DESC[it.key] || '') + '</div>'
           + '</div>'
           + '<div class="ib-n' + (n ? '' : ' zero') + '">' + (n > 99 ? '99+' : n) + '</div>'
           + '</a>';
    }
    list.innerHTML = html;
  }

  function load(){
    fetch('/api/inbox', {headers:{'X-Requested-With':'XMLHttpRequest'}})
      .then(function(r){ return r.json(); })
      .then(render)
      .catch(function(){});
  }

  load();
  setInterval(load, 30000);

  try {
    var s = window.__monoSio && window.__monoSio();
    if (s) {
      s.on('inbox_update', function(){ load(); });
      s.on('notification', function(){ setTimeout(load, 300); });
      s.on('private_message', function(){ setTimeout(load, 300); });
    }
  } catch(e){}
})();
</script>
{% endblock %}
