{% extends "base.html" %}
{% block title %}{% block xqm_title %}中国象棋大师{% endblock %} - MONO 社区{% endblock %}
{% set active = 'games' %}

{% block content %}
<style>
/* ══════════════════════════════════════════
   中国象棋大师 —— 所有类名带 xqm- 前缀
   面板用站点主题变量（跟随明暗/羊皮纸/海洋主题），
   棋盘保留木质配色（游戏本体，不跟主题走）
   ══════════════════════════════════════════ */
.xqm{--xqm-red:#8B1A1A;--xqm-red-lt:#C0392B;--xqm-red-dk:#5E0F0F;
     --xqm-green:#1B3A2F;--xqm-green-lt:#2E6151;--xqm-green-dk:#0B1E18;
     --xqm-gold:#C9A227;--xqm-gold-lt:#E4C55A;--xqm-gold-dk:#8C6E15;
     --xqm-wood1:#E3C9A2;--xqm-wood2:#CFAE81;--xqm-wood3:#B99464;
     --xqm-hp-full:#4A8B5C;--xqm-hp-mid:#C9A227;--xqm-hp-low:#A52222;
     --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
     --r1:8px;--r2:12px;--r3:18px;
     --t-xs:11px;--t-sm:12.5px;--t-md:15px;--t-lg:18px;--t-xl:24px;--t-2xl:32px;
     --d1:120ms;--d2:180ms;--d3:260ms;--d4:420ms;
     --ease:cubic-bezier(.22,.9,.3,1);
     --spring:cubic-bezier(.34,1.5,.64,1);
     --sh1:0 2px 8px rgba(60,40,20,.1);
     --sh2:0 8px 22px rgba(60,40,20,.14);
     --sh3:0 18px 44px rgba(60,40,20,.2);
     --n1:rgba(60,45,28,.06);--n2:rgba(60,45,28,.13);--n3:rgba(60,45,28,.24);
     max-width:1280px;margin:0 auto;}
html[data-theme="dark"] .xqm{
     --sh1:0 2px 8px rgba(0,0,0,.32);
     --sh2:0 8px 22px rgba(0,0,0,.42);
     --sh3:0 18px 44px rgba(0,0,0,.55);
     --n1:rgba(255,245,225,.06);--n2:rgba(255,245,225,.12);--n3:rgba(255,245,225,.2);}
.xqm *{box-sizing:border-box}
.wrap.xqm-wide{max-width:1280px}

/* 视图切换 */
.xqm-view{display:none;animation:xqmIn .34s cubic-bezier(.22,.9,.3,1) both}
.xqm-view.xqm-on{display:block}
@keyframes xqmIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 按钮 */
.xqm-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 26px;border-radius:12px;border:1px solid transparent;
  font-size:14.5px;font-weight:700;letter-spacing:.03em;cursor:pointer;
  font-family:inherit;
  transition:transform .16s cubic-bezier(.34,1.5,.64,1),box-shadow .18s ease;
}
.xqm-btn:active{transform:translateY(1px) scale(.985)}
.xqm-btn-p{background:linear-gradient(180deg,#A52222,#7A1212);color:#FFF6E0;
  box-shadow:0 6px 18px rgba(122,18,18,.3),inset 0 1px 0 rgba(255,255,255,.18)}
.xqm-btn-p:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(122,18,18,.38)}
.xqm-btn-g{background:linear-gradient(180deg,rgba(228,197,90,.96),rgba(201,162,39,.92));color:#3A2C05;
  box-shadow:0 6px 18px rgba(140,110,21,.28),inset 0 1px 0 rgba(255,255,255,.4)}
.xqm-btn-g:hover{transform:translateY(-2px)}
/* ── 国风字体栈：优先华文中宋 / 宋体-简，回退思源宋 / 系统宋体 ── */
.xqm{
  --xqm-f-serif:"STZhongsong","华文中宋","Songti SC","STSong","宋体-简","Source Han Serif SC",
    "Noto Serif CJK SC","SimSun",serif;
  --xqm-f-kai:"STKaiti","KaiTi","楷体","Kaiti SC","Kaiti TC",serif;
}
.xqm-cdx-head .nm{
  font-family:var(--xqm-f-serif);font-feature-settings:"halt" 0}
.xqm-pc,.xqm-river span,.xqm-cdx-head .sub,.xqm-cdx-card .nm{
  font-family:var(--xqm-f-kai)}
.xqm-cdx-card .nm{letter-spacing:.1em}
/* 移动端横屏是沉浸式的，导航被隐藏了 —— 给个回主页的出口。
   PC 有导航栏，不需要这个按钮，所以只在横屏态显示。 */
.xqm-homeback{display:none}
html[data-xqm-land="1"] .xqm-homeback{
  display:inline-flex;align-items:center;
  /* 固定到舞台左上角（.xqm 是 fixed，作为定位参考）——
     放右栏里会跟标题挤在一起，也不好找。 */
  position:absolute;left:10px;top:8px;z-index:30;
  font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:99px;
  border:1px solid rgba(120,90,50,.40);background:rgba(255,252,245,.92);
  color:#7a5b00;text-decoration:none;
  box-shadow:0 1px 6px rgba(90,70,40,.16);
}
html[data-xqm-land="1"] .xqm-homeback:active{background:rgba(201,162,39,.22)}
/* ── 图鉴：状态角标 + 进度条 ── */
.xqm-cdx-card .pb{width:100%;height:5px;border-radius:99px;background:rgba(120,90,50,.16);
  overflow:hidden;margin-top:5px}
.xqm-cdx-card .pb > i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,rgba(201,162,39,.75),rgba(228,197,90,.95))}
.xqm-cdx-card .pb.full > i{background:linear-gradient(90deg,#3B9A5F,#5FBF7F)}
.xqm-cdx-card .pbt{font-size:10px;color:var(--muted);margin-top:3px;
  font-variant-numeric:tabular-nums}
.xqm-cdx-card .tagcat{position:absolute;right:8px;bottom:8px;font-size:10px;font-weight:800;
  padding:2px 7px;border-radius:99px;letter-spacing:.04em;z-index:4}
.xqm-cdx-card .tagcat.c0{background:rgba(201,162,39,.24);color:#8a6a12}
.xqm-cdx-card .tagcat.c1{background:rgba(44,111,224,.18);color:#1d4fa8}
.xqm-cdx-card .tagcat.c2{background:rgba(59,154,95,.18);color:#226b3c}
.xqm-cdx-card .tagcat.c3{background:rgba(120,120,120,.18);color:#6b6b6b}
.xqm-cdx-card .badge,.xqm-grade{font-family:var(--xqm-f-serif);letter-spacing:.16em}
.xqm-btn-o{color:var(--fg);
  background:linear-gradient(180deg,rgba(255,252,244,.98),rgba(246,238,224,.98));
  border:1px solid rgba(201,162,39,.38);
  box-shadow:0 2px 8px rgba(90,60,20,.06),inset 0 1px 0 rgba(255,255,255,.8)}
.xqm-btn-o:hover{transform:translateY(-2px);border-color:rgba(201,162,39,.7);
  box-shadow:0 8px 20px rgba(90,60,20,.14)}
html[data-theme="dark"] .xqm-btn-o{
  background:linear-gradient(180deg,rgba(62,54,44,.92),rgba(44,38,32,.92));
  border-color:rgba(201,162,39,.32)}
.xqm-btn-d{background:transparent;color:var(--xqm-red-lt);
  border:1px solid rgba(192,57,43,.5);box-shadow:none}
.xqm-btn-d:hover{background:rgba(192,57,43,.12);border-color:var(--xqm-red-lt)}
html[data-theme="dark"] .xqm-btn-d{color:#E2705F;border-color:rgba(226,112,95,.5)}
html[data-theme="dark"] .xqm-btn-d:hover{background:rgba(226,112,95,.14);border-color:#E2705F}
.xqm-btn-sm{padding:8px 16px;font-size:13px;border-radius:10px}
.xqm-btn:disabled{opacity:.5;cursor:not-allowed;transform:none !important}

/* ══ 首页 ══ */
.xqm-hero{text-align:center;padding:36px 20px 30px;border-bottom:1px solid var(--line);margin-bottom:32px;
  position:relative}
.xqm-hero::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);
  width:170px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--xqm-gold),transparent)}
.xqm-badge{display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.22em;
  color:#FFF6E0;padding:6px 16px 6px 9px;border-radius:9px;margin-bottom:22px;
  background:linear-gradient(160deg,#C0392B,#7A1212);
  box-shadow:inset 0 0 0 1px rgba(255,246,224,.3),0 3px 10px rgba(90,20,10,.28)}
.xqm-badge::before{content:"弈";width:22px;height:22px;border-radius:5px;display:grid;
  place-items:center;background:rgba(255,246,224,.16);font-family:"KaiTi","STKaiti","楷体",serif;
  font-size:14px;font-weight:800;letter-spacing:0;transform:rotate(-6deg);color:#FFF6E0}
.xqm-title{margin:0;font-size:48px;font-weight:800;letter-spacing:.09em;line-height:1.2;
  font-family:"Songti SC","STSong","SimSun",serif;
  background:linear-gradient(178deg,#B02A2A,var(--xqm-red) 45%,var(--xqm-red-dk));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.xqm-sub{margin:16px 0 0;color:var(--muted);font-size:14.5px;letter-spacing:.1em;line-height:2}
.xqm-pieces{display:flex;gap:13px;margin:30px 0 34px;flex-wrap:wrap;justify-content:center}
.xqm-acts{display:flex;gap:13px;flex-wrap:wrap;justify-content:center}
.xqm-me{display:inline-flex;align-items:center;gap:10px;margin-top:22px;
  padding:8px 18px;border-radius:99px;background:var(--soft);border:1px solid var(--line);
  font-size:13px;color:var(--fg)}
.xqm-me b{color:var(--xqm-gold-dk);font-size:15px}

/* ══ 棋子 ══ */
.xqm-pc{--sz:62px;width:var(--sz);height:var(--sz);border-radius:50%;
  display:grid;place-items:center;position:relative;flex-shrink:0;
  font-family:"STKaiti","KaiTi","楷体","Kaiti SC","STSong","Songti SC","SimSun",serif;
  font-weight:700;font-size:calc(var(--sz)*.46);color:#FFF8E7;
  letter-spacing:.04em;
  text-shadow:0 1px 2px rgba(0,0,0,.62),0 0 1px rgba(0,0,0,.95),
    0 -1px 0 rgba(255,255,255,.14);user-select:none}
.xqm-pc::before{content:"";position:absolute;inset:6%;border-radius:50%;
  border:1px solid rgba(255,248,231,.16);pointer-events:none}
.xqm-pc.red{background:radial-gradient(circle at 34% 26%,#D0483F 0%,#A52222 44%,#6E0F0F 100%);
  box-shadow:inset 0 0 0 2px rgba(201,162,39,.92),inset 0 0 0 3.5px rgba(0,0,0,.2),
    inset 0 3px 9px rgba(255,255,255,.3),inset 0 -6px 12px rgba(0,0,0,.42),0 4px 12px rgba(70,20,20,.38)}
.xqm-pc.black{background:radial-gradient(circle at 34% 26%,#3A6B57 0%,#1E4536 44%,#0A1C16 100%);
  box-shadow:inset 0 0 0 2px rgba(201,162,39,.92),inset 0 0 0 3.5px rgba(0,0,0,.2),
    inset 0 3px 9px rgba(255,255,255,.26),inset 0 -6px 12px rgba(0,0,0,.45),0 4px 12px rgba(10,30,24,.42)}
.xqm-pc .xqm-glyph{position:relative;z-index:2;line-height:1}
.xqm-pc .xqm-cracks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.xqm-pc .xqm-cracks path{fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:220;stroke-dashoffset:220;opacity:0;
  transition:stroke-dashoffset .46s cubic-bezier(.32,.94,.4,1),opacity .24s ease}
.xqm-pc .xqm-cracks path.dk{stroke:rgba(6,3,2,.74)}
.xqm-pc .xqm-cracks path.lt{stroke:rgba(255,247,228,.34);stroke-width:1;transform:translate(.85px,-.85px)}
.xqm-pc .xqm-cracks polygon.chip{fill:rgba(6,3,2,.46);opacity:0;transform:scale(.4);
  transform-origin:50% 50%;transition:opacity .3s ease,transform .34s cubic-bezier(.34,1.5,.64,1)}
.xqm-pc[data-dmg="1"] .xqm-cracks path[data-t="1"],
.xqm-pc[data-dmg="2"] .xqm-cracks path[data-t="1"],.xqm-pc[data-dmg="2"] .xqm-cracks path[data-t="2"],
.xqm-pc[data-dmg="3"] .xqm-cracks path[data-t="1"],.xqm-pc[data-dmg="3"] .xqm-cracks path[data-t="2"],
.xqm-pc[data-dmg="3"] .xqm-cracks path[data-t="3"],
.xqm-pc[data-dmg="4"] .xqm-cracks path{stroke-dashoffset:0;opacity:1}
.xqm-pc[data-dmg="2"] .xqm-cracks polygon.chip[data-t="1"],
.xqm-pc[data-dmg="3"] .xqm-cracks polygon.chip,.xqm-pc[data-dmg="4"] .xqm-cracks polygon.chip{opacity:1;transform:scale(1)}
.xqm-pc[data-dmg="4"]{filter:saturate(.72) brightness(.9)}
.xqm-pc.xqm-cracking .xqm-cracks path{transition-duration:.24s}
.xqm-pc.xqm-static .xqm-cracks path,
.xqm-pc.xqm-static .xqm-cracks polygon.chip{transition:none}
.xqm-pc.xqm-low::before{animation:xqmLow 1.15s ease-in-out infinite}
@keyframes xqmLow{0%,100%{box-shadow:0 0 4px 0 rgba(165,34,34,.35),inset 0 0 4px rgba(165,34,34,.3)}
  50%{box-shadow:0 0 12px 3px rgba(190,40,34,.85),inset 0 0 9px rgba(190,40,34,.6)}}
.xqm-pc.xqm-hit{animation:xqmHit .34s ease}
@keyframes xqmHit{0%{filter:brightness(1)}18%{filter:brightness(2.6) saturate(.3)}100%{filter:brightness(1)}}
.xqm-pc.xqm-sel::after{content:"";position:absolute;inset:-7px;border-radius:50%;
  border:2.5px solid var(--xqm-gold);pointer-events:none;
  animation:xqmSel 1.5s ease-in-out infinite}
@keyframes xqmSel{0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(201,162,39,.5)}
  50%{opacity:.62;transform:scale(1.05);box-shadow:0 0 0 8px rgba(201,162,39,0)}}
.xqm-pc.xqm-ghost{opacity:.2;filter:grayscale(.75)}
.xqm-hpwrap{width:58px;margin-top:6px}
.xqm-hpbar{height:6px;border-radius:99px;overflow:hidden;position:relative;
  background:rgba(40,30,20,.24);box-shadow:inset 0 1px 2px rgba(0,0,0,.28)}
.xqm-hpbar > i{display:block;height:100%;border-radius:99px;position:relative;
  transition:width .42s cubic-bezier(.4,0,.2,1),background .3s ease}
.xqm-hpbar > i::after{content:"";position:absolute;inset:0;border-radius:99px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),transparent 60%)}
.xqm-hpbar.hp-full > i{background:linear-gradient(90deg,#3E7A4E,var(--xqm-hp-full))}
.xqm-hpbar.hp-mid  > i{background:linear-gradient(90deg,#A8861D,var(--xqm-hp-mid))}
.xqm-hpbar.hp-low  > i{background:linear-gradient(90deg,#7E1A1A,var(--xqm-hp-low))}
.xqm-hptext{font-size:10.5px;color:var(--muted);text-align:center;margin-top:3px;
  font-variant-numeric:tabular-nums}

/* ══ 匹配页 ══ */
.xqm-match,#xqmMatch{min-height:60vh;display:grid;place-items:center;padding:30px 20px}
.xqm-mbox{text-align:center;max-width:520px;width:100%;margin:0 auto}
.xqm-ring{width:158px;height:158px;margin:0 auto 30px;position:relative}
.xqm-ring .r{position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
.xqm-ring .r1{border-top-color:var(--xqm-gold);border-right-color:rgba(201,162,39,.3);
  animation:xqmSpin 1.5s linear infinite}
.xqm-ring .r2{inset:19px;border-bottom-color:var(--xqm-red);border-left-color:rgba(139,26,26,.3);
  animation:xqmSpin 2.1s linear infinite reverse}
.xqm-ring .r3{inset:38px;border-top-color:var(--xqm-green-lt);animation:xqmSpin 1.2s linear infinite}
@keyframes xqmSpin{to{transform:rotate(360deg)}}
.xqm-core{position:absolute;inset:53px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,162,39,.22),rgba(201,162,39,.04));
  display:grid;place-items:center;font-size:32px;animation:xqmCore 1.7s ease-in-out infinite}
@keyframes xqmCore{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.09);opacity:1}}
.xqm-ring.xqm-ring-done .r{animation:none;border-color:rgba(201,162,39,.9)}
.xqm-ring.xqm-ring-done .r2,.xqm-ring.xqm-ring-done .r3{border-color:rgba(201,162,39,.45)}
.xqm-ring.xqm-ring-done .xqm-core{animation:xqmFoundPop .5s var(--spring) both;font-size:38px;
  background:radial-gradient(circle,rgba(201,162,39,.42),rgba(201,162,39,.08))}
@keyframes xqmFoundPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.xqm-mtitle{font-size:22px;font-weight:800;letter-spacing:.06em;margin:0 0 11px;
  font-family:"Songti SC","STSong",serif;color:var(--fg)}
.xqm-mfail .xqm-ring .r{animation:none;border-color:rgba(165,34,34,.4)}
.xqm-mfail .xqm-ring .xqm-core{animation:none;color:var(--xqm-red-lt)}
.xqm-mfail .xqm-mtitle{color:var(--xqm-red-lt)}
.xqm-msub{color:var(--muted);font-size:13.5px;line-height:1.9;min-height:52px}
.xqm-mfound{margin-top:24px;padding:20px;border-radius:16px;
  background:var(--card);border:1px solid rgba(201,162,39,.45);
  animation:xqmFound .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes xqmFound{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.xqm-vs{display:flex;align-items:center;justify-content:center;gap:24px}
.xqm-vs .side{flex:1;text-align:center;min-width:0}
.xqm-vs .nm{font-size:15px;font-weight:700;margin-top:10px;color:var(--fg);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xqm-vs .rt{font-size:12px;color:var(--xqm-gold-dk);margin-top:4px;letter-spacing:.06em}
.xqm-vs .vsw{font-size:22px;font-weight:900;color:var(--xqm-gold-dk);
  font-family:"Songti SC",serif;letter-spacing:.1em}

/* ══ 对战页 ══ */
.xqm-bt{--btnav:56px;--btbot:0px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  height:calc(100dvh - var(--btnav) - var(--btbot) - 26px);min-height:420px;gap:var(--s3)}
.xqm-bt-top,.xqm-bt-bot{display:flex;align-items:center;gap:var(--s3);
  padding:var(--s2) var(--s3);border-radius:var(--r2);background:var(--card);
  border:1px solid var(--line);min-width:0}
.xqm-side{display:flex;align-items:center;gap:var(--s2);min-width:0}
.xqm-sideinfo{min-width:0;flex:1 1 auto;overflow:hidden}
.xqm-ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  font-size:19px;flex-shrink:0;border:2px solid}
.xqm-ava.red{background:linear-gradient(160deg,#C0392B,#7A1212);border-color:rgba(201,162,39,.85)}
.xqm-ava.black{background:linear-gradient(160deg,#2E6151,#0B1E18);border-color:rgba(201,162,39,.85)}
.xqm-nm{font-size:var(--t-sm);font-weight:700;line-height:1.3;color:var(--fg);
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xqm-rt{font-size:var(--t-xs);color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.xqm-round{font-size:var(--t-sm);color:var(--xqm-gold-dk);letter-spacing:.08em;font-weight:700;
  padding:5px 13px;border-radius:99px;border:1px solid rgba(201,162,39,.45);
  background:rgba(201,162,39,.1);white-space:nowrap}
html[data-theme="dark"] .xqm-round{color:var(--xqm-gold-lt)}

.xqm-ringwrap{position:relative;width:46px;height:46px;flex-shrink:0}
.xqm-ringwrap .xqm-ava{position:absolute;inset:3px;width:auto;height:auto;font-size:16px}
/* 只作用于头像外圈的进度环。裸 .xqm-ring 也会命中匹配页那个 158px 的大圆环，
   两者共用一个类名，必须用 .xqm-ringwrap > 把小环的尺寸钉死在父容器上。 */
.xqm-ringwrap > .xqm-ring{position:absolute;inset:0;width:100%;height:100%;
  border-radius:50%;pointer-events:none;color:var(--xqm-gold);
  background:conic-gradient(currentColor var(--p,0%),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
  transition:color var(--d3) var(--ease)}
.xqm-ringwrap.urgent > .xqm-ring{color:var(--xqm-red-lt);
  animation:xqmRingPulse .9s ease-in-out infinite}
.xqm-ringwrap.off > .xqm-ring{opacity:0}
@keyframes xqmRingPulse{0%,100%{opacity:1}50%{opacity:.42}}
.xqm-ringnum{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
  font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);
  white-space:nowrap;padding:0 5px;border-radius:99px;background:var(--card);
  border:1px solid var(--line);line-height:1.5}
.xqm-ringwrap.off .xqm-ringnum{display:none}
.xqm-ringwrap.urgent .xqm-ringnum{color:#FFF6E0;background:var(--xqm-red-lt);
  border-color:var(--xqm-red-lt)}

.xqm-trays{display:flex;gap:3px;align-items:center;min-height:20px;flex-wrap:wrap;
  max-width:210px;flex:1}
.xqm-trays .xqm-tray{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-size:9.5px;font-weight:700;font-family:"Songti SC","STSong",serif;color:#FFF8E7;
  opacity:.6;flex-shrink:0}
.xqm-trays .xqm-tray.red{background:radial-gradient(circle at 34% 26%,#D0483F,#7A1212)}
.xqm-trays .xqm-tray.black{background:radial-gradient(circle at 34% 26%,#3A6B57,#0B1E18)}

.xqm-tug{flex:1.2;min-width:130px}
.xqm-tug-bar{height:12px;border-radius:99px;overflow:hidden;display:flex;background:var(--n2);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.xqm-tug-bar > i{display:block;height:100%;transition:width var(--d4) var(--ease)}
.xqm-tug-bar > i.red{background:linear-gradient(90deg,#7A1212,#D0483F)}
.xqm-tug-bar > i.black{background:linear-gradient(90deg,#0B1E18,#3A6B57);margin-left:auto}
.xqm-tug-txt{display:flex;justify-content:space-between;gap:14px;font-size:var(--t-xs);
  color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;min-width:0}
.xqm-tug-txt > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xqm-tug-txt > span:last-child{text-align:right}

.xqm-bt-mid{display:grid;grid-template-columns:minmax(0,1fr) 320px;
  grid-template-rows:minmax(0,1fr);gap:var(--s3);min-height:0}
.xqm-boardwrap{display:flex;align-items:center;justify-content:center;
  min-width:0;min-height:0;position:relative}
.xqm-board{--cw:50px;--ch:48px;--bpx:19px;--bpy:17px;--gw:1.1px;display:grid;
  grid-template-columns:repeat(9,var(--cw));grid-template-rows:repeat(10,var(--ch));
  padding:var(--bpy) var(--bpx);border-radius:16px;position:relative;
  background-image:
    repeating-linear-gradient(88deg,rgba(150,115,70,.055) 0 1px,transparent 1px 25px),
    linear-gradient(168deg,var(--xqm-wood1),var(--xqm-wood2) 55%,var(--xqm-wood3));
  background-repeat:no-repeat;
  box-shadow:inset 0 0 0 2px rgba(120,90,50,.35),0 16px 38px rgba(90,70,40,.22);
  transition:box-shadow .3s ease}
.xqm-board.xqm-focus{box-shadow:inset 0 0 0 2px rgba(120,90,50,.35),
  0 16px 38px rgba(90,70,40,.22),inset 0 0 90px rgba(60,40,20,.26)}
.xqm-board.xqm-shake{animation:xqmShake .32s cubic-bezier(.36,.07,.19,.97)}
@keyframes xqmShake{10%,90%{transform:translate(-2px,0)}20%,80%{transform:translate(4px,0)}
  30%,50%,70%{transform:translate(-6px,0)}40%,60%{transform:translate(6px,0)}}
.xqm-cell{display:grid;place-items:center;position:relative}
.xqm-hl{position:absolute;inset:7%;border-radius:50%;z-index:1;cursor:pointer;
  animation:xqmHl .26s cubic-bezier(.34,1.56,.64,1) both}
@keyframes xqmHl{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.xqm-hl.mv{background:radial-gradient(circle at 38% 32%,rgba(95,190,130,.62),rgba(78,168,112,.42) 68%);
  box-shadow:inset 0 0 0 2px rgba(58,140,92,.9),0 0 12px rgba(95,190,130,.55)}
.xqm-hl.rng{background:repeating-linear-gradient(45deg,
    rgba(240,214,110,.95) 0 4px,rgba(196,158,36,.62) 4px 8px);
  box-shadow:inset 0 0 0 2px rgba(201,162,39,.95),0 0 12px rgba(228,197,90,.5)}
.xqm-hl.both{background:repeating-linear-gradient(45deg,
    rgba(240,214,110,.92) 0 4px,rgba(196,158,36,.55) 4px 8px),rgba(78,168,112,.42);
  box-shadow:inset 0 0 0 2px rgba(201,162,39,.95),0 0 14px rgba(228,197,90,.6)}
.xqm-hl.heal{background:radial-gradient(circle at 38% 32%,rgba(120,225,175,.34),rgba(78,168,112,.22) 68%);
  box-shadow:inset 0 0 0 3px rgba(120,225,175,.95),0 0 14px rgba(120,225,175,.5)}
.xqm-hl .foemark{position:absolute;inset:-4%;border-radius:50%;
  border:2.5px solid rgba(200,60,50,.95);animation:xqmFoe 1.25s ease-in-out infinite}
@keyframes xqmFoe{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(200,60,50,.55)}
  50%{opacity:.65;box-shadow:0 0 0 7px rgba(200,60,50,0)}}
.xqm-cell .xqm-pc{z-index:3;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.xqm-cell .xqm-pc.xqm-mine:hover{transform:translateY(-3px) scale(1.06)}
.xqm-board .xqm-pc{--sz:calc(var(--cw) - 8px)}
.xqm-board .xqm-pc.xqm-sel::after{inset:-3px;border-width:2px}
.xqm-river{position:absolute;left:0;right:0;height:var(--ch);top:calc(var(--bpy) + var(--ch)*4.5);
  pointer-events:none;z-index:2;display:flex;align-items:center;justify-content:space-between;
  padding:0 36px;
  background:linear-gradient(180deg,rgba(110,140,120,.10),rgba(110,140,120,.03) 55%,rgba(110,140,120,.09));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(90,70,40,.14)}
.xqm-river::before{content:"";position:absolute;left:8%;right:8%;top:50%;height:0;
  border-top:1.5px dashed rgba(80,115,90,.28)}
.xqm-river span{font-family:"KaiTi","STKaiti","楷体","Kaiti SC","Songti SC",serif;font-size:21px;
  letter-spacing:.5em;color:rgba(52,84,64,.58);text-shadow:0 1px 0 rgba(255,255,255,.32);
  animation:xqmWater 5.5s ease-in-out infinite}
.xqm-river span:last-child{animation-delay:1.6s}
@keyframes xqmWater{0%,100%{opacity:.62}50%{opacity:.92}}
.xqm-palace{position:absolute;width:calc(var(--cw)*2);height:calc(var(--ch)*2);
  left:calc(var(--bpx) + var(--cw)*3.5);
  pointer-events:none;z-index:1;
  background:
    linear-gradient(to bottom right,transparent calc(50% - var(--gw)),var(--xqm-grid,rgba(110,82,48,.42)) calc(50% - var(--gw)),
      var(--xqm-grid,rgba(110,82,48,.42)) calc(50% + var(--gw)),transparent calc(50% + var(--gw))),
    linear-gradient(to bottom left,transparent calc(50% - var(--gw)),var(--xqm-grid,rgba(110,82,48,.42)) calc(50% - var(--gw)),
      var(--xqm-grid,rgba(110,82,48,.42)) calc(50% + var(--gw)),transparent calc(50% + var(--gw)))}
.xqm-palace.p2{top:calc(var(--bpy) + var(--ch)*0.5)}
.xqm-palace.p1{top:calc(var(--bpy) + var(--ch)*7.5)}

/* 深色主题下的棋盘 */
html[data-theme="dark"] .xqm-board{
  background-image:
    repeating-linear-gradient(88deg,rgba(190,160,110,.05) 0 1px,transparent 1px 25px),
    linear-gradient(168deg,#3B3328,#2C261D 55%,#1F1A13);
  box-shadow:inset 0 0 0 2px rgba(140,115,75,.4),0 16px 38px rgba(0,0,0,.5)}
html[data-theme="dark"] .xqm-board,
html[data-theme="dark"] .xqm-hboard,
html[data-theme="dark"] .xqm-mb{--xqm-grid:rgba(205,180,135,.32)}
html[data-theme="dark"] .xqm-palace{
  background:
    linear-gradient(to bottom right,transparent calc(50% - 1.1px),rgba(205,180,135,.3) calc(50% - 1.1px),
      rgba(205,180,135,.3) calc(50% + 1.1px),transparent calc(50% + 1.1px)),
    linear-gradient(to bottom left,transparent calc(50% - 1.1px),rgba(205,180,135,.3) calc(50% - 1.1px),
      rgba(205,180,135,.3) calc(50% + 1.1px),transparent calc(50% + 1.1px))}
html[data-theme="dark"] .xqm-river span{color:rgba(150,190,170,.5);text-shadow:none}

/* 右侧面板 */
.xqm-col{display:flex;flex-direction:column;gap:var(--s3);min-width:0;min-height:0;overflow-y:auto}
.xqm-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);
  padding:var(--s3) var(--s4);color:var(--fg);flex-shrink:0}
.xqm-panel h4{margin:0 0 10px;font-size:var(--t-sm);font-weight:700;color:var(--muted);letter-spacing:.07em}
.xqm-panel-log{flex:1 1 auto;min-height:130px;display:flex;flex-direction:column}
.xqm-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;
  font-size:var(--t-sm);line-height:1.6;min-height:0}
.xqm-logline{display:flex;gap:7px;padding:4px 8px;border-radius:7px;background:var(--n1);
  color:var(--fg)}
.xqm-logline .t{color:var(--muted);font-size:var(--t-xs);flex-shrink:0;
  font-variant-numeric:tabular-nums}
.xqm-logline.r{background:rgba(192,57,43,.1);color:var(--xqm-red)}
.xqm-logline.b{background:rgba(46,97,81,.1);color:var(--xqm-green-lt)}
.xqm-logline.k{background:rgba(201,162,39,.16);color:var(--xqm-gold-dk);font-weight:700}
.xqm-logline.d{color:var(--muted)}
html[data-theme="dark"] .xqm-logline.r{color:#F0A0A0}
html[data-theme="dark"] .xqm-logline.b{color:#8FD0BB}
html[data-theme="dark"] .xqm-logline.k{color:var(--xqm-gold-lt)}

.xqm-prev{position:absolute;left:50%;top:-10px;transform:translateX(-50%);z-index:9;
  font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:99px;white-space:nowrap;
  background:rgba(122,18,18,.94);color:#FFE9A8;pointer-events:none;
  box-shadow:0 2px 8px rgba(0,0,0,.32);animation:xqmPrevIn var(--d2) var(--spring) both}
@keyframes xqmPrevIn{from{opacity:0;transform:translate(-50%,4px) scale(.8)}
  to{opacity:1;transform:translate(-50%,0) scale(1)}}
.xqm-last{position:absolute;inset:15%;border-radius:50%;pointer-events:none;z-index:2;
  border:2px dashed rgba(201,162,39,.9);animation:xqmLastIn var(--d3) var(--ease) both}
.xqm-last.to{inset:8%;border-style:solid;box-shadow:0 0 12px rgba(201,162,39,.55)}
@keyframes xqmLastIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.xqm-tagpop{position:absolute;left:50%;top:-16px;transform:translateX(-50%);z-index:10;
  font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px;white-space:nowrap;
  background:rgba(201,162,39,.95);color:#3A2C05;pointer-events:none;
  animation:xqmTagPop 1.2s var(--ease) forwards}
.xqm-tagpop.heal{background:rgba(56,148,92,.96);color:#F2FFF7;
  box-shadow:0 2px 10px rgba(28,88,52,.38)}
@keyframes xqmTagPop{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}
  18%{opacity:1;transform:translate(-50%,0) scale(1)}
  78%{opacity:1;transform:translate(-50%,-14px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-26px) scale(.95)}}
.xqm-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.xqm-only-sm{display:none}
/* 教程是右侧栏里的一张普通卡片，不是浮层。
   原来做成 fixed 浮层，但棋盘几乎撑满左栏、四周留白不足 150px，
   浮层无论放哪都会压住棋子或侧栏。塞进 .xqm-col 最省事，也不挡任何东西。 */
.xqm-tut{background:var(--gc-bg,var(--card));border:1px solid rgba(201,162,39,.6);
  border-radius:var(--r2);padding:14px 16px;animation:xqmTutIn .34s var(--ease) both;
  flex-shrink:0}
@keyframes xqmTutIn{from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:none}}
.xqm-tut .st{display:flex;gap:6px;margin-bottom:12px}
.xqm-tut .st i{width:22px;height:4px;border-radius:99px;background:var(--n3);display:block;
  transition:background var(--d3) var(--ease)}
.xqm-tut .st i.on{background:var(--xqm-gold)}
.xqm-tut h5{margin:0 0 8px;font-size:var(--t-md);font-weight:800;color:var(--fg)}
.xqm-tut p{margin:0 0 16px;font-size:var(--t-sm);line-height:1.85;color:var(--muted)}
.xqm-tut .acts{display:flex;gap:10px}
.xqm-tut .acts .xqm-btn{flex:1}

/* ══ 首页数据卡 / 继续对局 ══ */
.xqm-resume{display:flex;align-items:center;gap:10px;background:rgba(201,162,39,.12);
  border:1px solid rgba(201,162,39,.55);border-radius:var(--r2);padding:11px 14px;
  margin-bottom:12px;text-decoration:none;color:var(--fg);font-size:var(--t-sm);font-weight:700;
  animation:xqmIn .4s var(--ease) both}
.xqm-resume:hover{border-color:var(--xqm-gold)}
.xqm-resume .dot{width:8px;height:8px;border-radius:50%;background:var(--xqm-gold);
  animation:xqmDot 1.3s ease-in-out infinite;flex-shrink:0}
.xqm-resume .go{margin-left:auto;color:var(--xqm-gold-dk)}
html[data-theme="dark"] .xqm-resume .go{color:var(--xqm-gold-lt)}
.xqm-hstat{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);
  padding:14px 16px;margin-bottom:12px}
.xqm-hstat .row{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.xqm-hstat .big{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--fg);line-height:1}
.xqm-hstat .k{font-size:var(--t-xs);color:var(--muted)}
.xqm-hstat .bar{height:8px;border-radius:99px;background:var(--n2);overflow:hidden;display:flex}
.xqm-hstat .bar > i{display:block;height:100%}
.xqm-hstat .bar > i.w{background:linear-gradient(90deg,#3E7A4E,#4A8B5C)}
.xqm-hstat .bar > i.d{background:var(--n3)}
.xqm-hstat .bar > i.l{background:linear-gradient(90deg,#7E1A1A,#A52222)}
.xqm-hstat .legend{display:flex;gap:13px;font-size:var(--t-xs);color:var(--muted);margin-top:8px;
  font-variant-numeric:tabular-nums;flex-wrap:wrap}
.xqm-hstat .legend b{color:var(--fg);font-weight:800}
.xqm-hassets{display:flex;gap:10px;margin-bottom:16px}
.xqm-hassets .a{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);
  padding:11px 13px;display:flex;align-items:center;gap:10px;min-width:0}
.xqm-hassets .a .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:12px;font-weight:800;flex-shrink:0;
  background:linear-gradient(160deg,rgba(228,197,90,.3),rgba(201,162,39,.1));
  border:1px solid rgba(201,162,39,.45);color:var(--xqm-gold-dk)}
html[data-theme="dark"] .xqm-hassets .a .ico{color:var(--xqm-gold-lt)}
.xqm-hassets .a .v{font-size:var(--t-md);font-weight:800;color:var(--fg);
  font-variant-numeric:tabular-nums;line-height:1.2}
.xqm-hassets .a .k{font-size:var(--t-xs);color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.xqm-hach{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.xqm-hach .b{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  font-size:var(--t-xs);font-weight:700;border:1px solid var(--line);background:var(--n1);
  color:var(--muted);cursor:default;transition:transform var(--d2) var(--spring)}
.xqm-hach .b.on{background:linear-gradient(160deg,rgba(228,197,90,.24),rgba(201,162,39,.08));
  border-color:rgba(201,162,39,.6);color:var(--xqm-gold-dk)}
html[data-theme="dark"] .xqm-hach .b.on{color:var(--xqm-gold-lt)}
.xqm-hach .b.on:hover{transform:translateY(-2px)}
.xqm-hach .b .n{font-variant-numeric:tabular-nums;opacity:.75}

/* ══ 设置页 ══ */
.xqm-set{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto}
.xqm-set .it{display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px}
.xqm-set .it .tx{flex:1;min-width:0}
.xqm-set .it .nm{font-size:var(--t-md);font-weight:700;color:var(--fg)}
.xqm-set .it .ds{font-size:var(--t-xs);color:var(--muted);margin-top:3px;line-height:1.6}
.xqm-sw{width:52px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--n2);
  position:relative;cursor:pointer;flex-shrink:0;transition:background var(--d2) var(--ease)}
.xqm-sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--card);box-shadow:var(--sh1);transition:transform var(--d2) var(--spring)}
.xqm-sw.on{background:linear-gradient(180deg,rgba(228,197,90,.95),rgba(201,162,39,.9));
  border-color:var(--xqm-gold-dk)}
.xqm-sw.on::after{transform:translateX(22px)}
.xqm-sw:focus-visible{outline:2px solid var(--xqm-gold);outline-offset:2px}
html[data-xqm-motion="0"] .xqm-board.xqm-shake,
html[data-xqm-motion="0"] .xqm-pc.xqm-hit,
html[data-xqm-motion="0"] .xqm-pc.xqm-low::before{animation:none !important}
html[data-xqm-motion="0"] .xqm-trail,
html[data-xqm-motion="0"] .xqm-frag{display:none}
html[data-xqm-cracks="0"] .xqm-pc .xqm-cracks{display:none}
.xqm-net{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:90;
  background:rgba(122,18,18,.96);color:#FFE9A8;font-size:var(--t-sm);font-weight:700;
  padding:8px 18px;border-radius:99px;box-shadow:var(--sh2);
  animation:xqmIn .3s var(--ease) both;white-space:nowrap}
.xqm-net.ok{background:rgba(46,97,81,.96);color:#D6F5E8}
.xqm-rp{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s3);align-items:start}
.xqm-rp-board{display:flex;justify-content:center;min-width:0}
.xqm-rp-board .xqm-board{--cw:46px;--ch:44px;--bpx:17px;--bpy:15px}
.xqm-rp-side{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.xqm-rp-step{font-size:var(--t-md);font-weight:800;color:var(--fg);
  font-variant-numeric:tabular-nums;margin-bottom:10px;text-align:center}
.xqm-rp-range{width:100%;margin-bottom:12px;accent-color:var(--xqm-gold);cursor:pointer}
.xqm-rp-btns{display:flex;gap:6px}
.xqm-rp-btns .xqm-btn{padding:8px 10px;min-width:40px}
.xqm-rp-hint{font-size:var(--t-xs);color:var(--muted);margin-top:10px;text-align:center}
.xqm-ltp{max-width:720px;margin:0 auto}
.xqm-ltp-stage{position:relative;height:min(54vh,400px);border-radius:var(--r3);overflow:hidden;
  background:radial-gradient(circle at 50% 52%,rgba(201,162,39,.16),transparent 64%),
    linear-gradient(170deg,var(--card),var(--soft));
  border:1px solid var(--line);display:grid;place-items:center}
.xqm-ltp-rays{position:absolute;left:50%;top:52%;width:160%;aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.2);pointer-events:none;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(240,214,110,.5) 0 1.6deg,transparent 1.6deg 13deg);
  -webkit-mask:radial-gradient(circle,transparent 16%,#000 34%,transparent 74%);
  mask:radial-gradient(circle,transparent 16%,#000 34%,transparent 74%)}
.xqm-ltp-ring{position:absolute;left:50%;top:52%;width:190px;height:190px;margin:-95px 0 0 -95px;
  border-radius:50%;pointer-events:none;opacity:0;
  border:2px solid rgba(228,197,90,.85);
  border-top-color:transparent;border-right-color:rgba(228,197,90,.25)}
.xqm-ltp-ring.r2{width:250px;height:250px;margin:-125px 0 0 -125px;
  border-color:rgba(228,197,90,.42);
  border-bottom-color:transparent;border-left-color:rgba(228,197,90,.14)}
.xqm-ltp-seal{width:118px;height:118px;border-radius:20px;display:grid;place-items:center;
  font-family:"KaiTi","STKaiti","楷体",serif;font-size:62px;font-weight:800;color:#FFF6E0;
  background:linear-gradient(160deg,#C0392B,#7A1212);position:relative;z-index:3;
  box-shadow:inset 0 0 0 3px rgba(255,246,224,.3),0 14px 34px rgba(90,20,10,.34)}
.xqm-ltp-flash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:6;
  background:radial-gradient(circle at 50% 52%,#FFFDF2 0%,#FFEFC0 24%,
    rgba(255,239,192,.38) 50%,transparent 76%)}
.xqm-ltp-dot{position:absolute;border-radius:50%;pointer-events:none;z-index:7}
.xqm-ltp-card{position:relative;z-index:5;display:inline-flex;flex-direction:column;align-items:center;
  gap:9px;padding:20px 34px;border-radius:var(--r3);background:var(--card);border:2px solid;
  opacity:0;transform:scale(.35) rotate(-10deg)}
.xqm-ltp-card.in{animation:xqmLtCardIn .64s cubic-bezier(.2,1.35,.4,1) forwards}
@keyframes xqmLtCardIn{
  0%{opacity:0;transform:scale(.35) rotate(-10deg);box-shadow:0 0 0 0 rgba(232,198,110,0)}
  56%{opacity:1;transform:scale(1.11) rotate(2.6deg);box-shadow:0 0 38px 12px rgba(232,198,110,.55)}
  76%{transform:scale(.975) rotate(-.9deg)}
  100%{opacity:1;transform:scale(1) rotate(0);box-shadow:0 0 0 0 rgba(232,198,110,0)}}
.xqm-ltp-card{overflow:hidden}
/* ── 抽赏：十连结果列表（按抽到的原始顺序，不合并不排序）── */
.xqm-ltp-list{position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:9px;
  justify-content:center;align-content:flex-start;
  width:100%;max-height:100%;overflow:auto;padding:6px 4px;box-sizing:border-box}
.xqm-ltp-item{display:flex;flex-direction:column;align-items:center;gap:3px;
  border:2px solid #bbb;border-radius:12px;padding:7px 9px;
  background:rgba(255,255,255,.78);box-shadow:0 2px 8px rgba(90,70,40,.10);
  animation:xqmLtItemIn .38s ease-out both}
.xqm-ltp-item .gi{font-size:10px;font-weight:800;letter-spacing:.1em;line-height:1}
.xqm-ltp-item .nm{font-size:11.5px;font-weight:700;letter-spacing:.06em}
.xqm-ltp-item .ct{font-size:11px;font-weight:800;color:#8a6a12}
@keyframes xqmLtItemIn{from{opacity:0;transform:translateY(12px) scale(.88)}to{opacity:1;transform:none}}
.xqm-ltp-card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.66) 47%,transparent 60%);
  background-size:260% 100%;opacity:0}
.xqm-ltp-card.in::after{animation:xqmLtSheen 1s ease-out .28s both}
@keyframes xqmLtSheen{0%{opacity:0;background-position:-130% 0}
  20%{opacity:1}100%{opacity:0;background-position:250% 0}}
.xqm-ltp-grade{font-size:var(--t-sm);font-weight:900;letter-spacing:.3em;text-indent:.3em}
.xqm-ltp-name{font-size:var(--t-lg);font-weight:800;color:var(--fg)}
.xqm-ltp-gain{font-size:var(--t-md);font-weight:800;color:var(--xqm-gold-dk);
  font-variant-numeric:tabular-nums}
html[data-theme="dark"] .xqm-ltp-gain{color:var(--xqm-gold-lt)}
.xqm-ltp-stage.charge .xqm-ltp-seal{animation:xqmLtSeal .9s cubic-bezier(.3,.9,.3,1) both}
@keyframes xqmLtSeal{
  0%{transform:scale(1) rotate(0);
     box-shadow:inset 0 0 0 3px rgba(255,246,224,.3),0 14px 34px rgba(90,20,10,.34)}
  18%{transform:scale(.93) rotate(-2.6deg)}
  34%{transform:scale(1.06) rotate(2.2deg)}
  50%{transform:scale(.97) rotate(-1.8deg)}
  64%{transform:scale(1.1) rotate(1.4deg)}
  78%{transform:scale(1.01) rotate(-.9deg)}
  90%{transform:scale(1.15) rotate(.6deg)}
  100%{transform:scale(1.24) rotate(0);
     box-shadow:inset 0 0 0 3px rgba(255,246,224,.6),
       0 0 46px 14px rgba(232,198,110,.78),0 14px 34px rgba(90,20,10,.34)}}
.xqm-ltp-stage.charge .xqm-ltp-ring{animation:xqmLtRingIn .9s cubic-bezier(.3,.9,.3,1) both}
@keyframes xqmLtRingIn{0%{opacity:0;transform:scale(2.7) rotate(0)}
  55%{opacity:.95}100%{opacity:1;transform:scale(1) rotate(210deg)}}
.xqm-ltp-stage.charge .xqm-ltp-ring.r2{animation:xqmLtRingIn2 .9s cubic-bezier(.3,.9,.3,1) both}
@keyframes xqmLtRingIn2{0%{opacity:0;transform:scale(2.35) rotate(0)}
  55%{opacity:.85}100%{opacity:1;transform:scale(1) rotate(-170deg)}}
.xqm-ltp-stage.burst{animation:xqmLtShake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes xqmLtShake{10%,90%{transform:translate(-3px,0)}20%,80%{transform:translate(5px,0)}
  30%,50%,70%{transform:translate(-7px,0)}40%,60%{transform:translate(7px,0)}}
.xqm-ltp-stage.burst .xqm-ltp-flash{animation:xqmLtFlash .44s ease-out both}
@keyframes xqmLtFlash{0%{opacity:0;transform:scale(.4)}
  9%{opacity:.97}100%{opacity:0;transform:scale(1.55)}}
.xqm-ltp-stage.burst .xqm-ltp-rays{animation:xqmLtRays .95s cubic-bezier(.15,.8,.3,1) both}
@keyframes xqmLtRays{0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(0)}
  12%{opacity:1}70%{opacity:.5}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.34) rotate(52deg)}}
.xqm-ltp-stage.burst .xqm-ltp-seal{animation:xqmLtSealOut .42s ease-out both}
@keyframes xqmLtSealOut{0%{opacity:1;transform:scale(1.24) rotate(0)}
  100%{opacity:0;transform:scale(2.15) rotate(40deg)}}
.xqm-ltp-hist{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.xqm-ltp-hist .h{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  font-size:var(--t-xs);font-weight:700;border:1px solid var(--line);background:var(--card);
  animation:xqmIn .3s var(--ease) both}
.xqm-ltp-hist .h .d{width:9px;height:9px;border-radius:50%}
.xqm-ltp-bar{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.xqm-ltp-bal{font-size:var(--t-sm);color:var(--muted);font-variant-numeric:tabular-nums}
.xqm-ltp-bal b{color:var(--xqm-gold-dk);font-size:var(--t-lg);font-weight:900}
html[data-theme="dark"] .xqm-ltp-bal b{color:var(--xqm-gold-lt)}
.xqm-ltp-odds{font-size:var(--t-xs);color:var(--muted);line-height:1.9;margin-top:10px}
.xqm-szn{background:var(--card);border:1px solid rgba(201,162,39,.45);border-radius:var(--r3);
  padding:18px 20px;margin-bottom:18px}
.xqm-szn .szn-top{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.xqm-szn .szn-name{font-size:var(--t-lg);font-weight:800;color:var(--fg);letter-spacing:.04em}
.xqm-szn .szn-left{margin-left:auto;font-size:var(--t-xs);color:var(--muted);
  font-variant-numeric:tabular-nums}
.xqm-szn .szn-bar{height:10px;border-radius:99px;background:var(--n2);overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
.xqm-szn .szn-bar > i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--xqm-gold-dk),var(--xqm-gold-lt));
  transition:width .8s var(--ease)}
.xqm-szn .szn-note{font-size:var(--t-xs);color:var(--muted);margin-top:9px;line-height:1.7}
.xqm-szn-hist{margin-top:24px}
.xqm-szn-hist h4{margin:0 0 12px;font-size:var(--t-sm);font-weight:700;color:var(--muted);
  letter-spacing:.07em}
.xqm-szn-hist .h{display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:var(--card);border:1px solid var(--line);border-bottom:none;font-size:var(--t-sm)}
.xqm-szn-hist .h:first-of-type{border-radius:var(--r2) var(--r2) 0 0}
.xqm-szn-hist .h:last-of-type{border-radius:0 0 var(--r2) var(--r2);border-bottom:1px solid var(--line)}
.xqm-szn-hist .h .s{color:var(--muted);font-size:var(--t-xs);width:132px;flex-shrink:0}
.xqm-szn-hist .h .n{flex:1;font-weight:700;color:var(--fg);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xqm-szn-hist .h .r{color:var(--xqm-gold-dk);font-weight:800;font-variant-numeric:tabular-nums}
html[data-theme="dark"] .xqm-szn-hist .h .r{color:var(--xqm-gold-lt)}
@media (max-width:900px){
  .xqm-rp{grid-template-columns:minmax(0,1fr)}
  .xqm-rp-board .xqm-board{--cw:36px;--ch:35px;--bpx:13px;--bpy:11px}
  .xqm-rp-side{flex-direction:row;overflow-x:auto;gap:var(--s2)}
  .xqm-rp-side .xqm-panel{flex-shrink:0;min-width:200px}
  .xqm-rp-side .xqm-panel-log{min-width:240px}
  .xqm-rp-side .xqm-log{max-height:120px}
}
.xqm-cell:focus-visible{outline:2px solid var(--xqm-gold);outline-offset:-2px;z-index:5}
.xqm-board.xqm-kbd .xqm-cell.xqm-cursor{box-shadow:inset 0 0 0 2px rgba(201,162,39,.95)}
.xqm-turn{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:11px;
  font-size:14px;font-weight:700;border:1px solid var(--line);transition:all .3s ease}
.xqm-turn.red{background:linear-gradient(135deg,rgba(192,57,43,.16),rgba(139,26,26,.07));
  border-color:rgba(192,57,43,.4);color:var(--xqm-red)}
.xqm-turn.black{background:linear-gradient(135deg,rgba(46,97,81,.16),rgba(11,30,24,.07));
  border-color:rgba(46,97,81,.4);color:var(--xqm-green-lt)}
html[data-theme="dark"] .xqm-turn.red{color:#F0A0A0}
html[data-theme="dark"] .xqm-turn.black{color:#8FD0BB}
.xqm-turn .dot{width:10px;height:10px;border-radius:50%;background:currentColor;
  animation:xqmDot 1.3s ease-in-out infinite;flex-shrink:0}
@keyframes xqmDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
.xqm-ap{display:flex;gap:6px;align-items:center;margin-top:10px}
.xqm-apdot{width:19px;height:19px;border-radius:50%;border:2px solid rgba(201,162,39,.5);
  background:rgba(201,162,39,.12);transition:all .28s cubic-bezier(.34,1.5,.64,1)}
.xqm-apdot.on{background:radial-gradient(circle at 35% 30%,var(--xqm-gold-lt),var(--xqm-gold));
  border-color:var(--xqm-gold-dk);box-shadow:0 0 10px rgba(201,162,39,.65)}
.xqm-aptxt{margin-left:5px;font-size:12.5px;color:var(--muted)}
.xqm-empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;line-height:1.8}
.xqm-skel{background:linear-gradient(90deg,var(--n1) 25%,var(--n2) 37%,var(--n1) 63%);
  background-size:400% 100%;animation:xqmSkel 1.3s ease-in-out infinite;border-radius:var(--r1)}
@keyframes xqmSkel{0%{background-position:100% 0}100%{background-position:0 0}}
.xqm-skel-row{height:48px;margin-bottom:8px}
.xqm-skel-card{height:104px;border-radius:var(--r3)}
.xqm-selhead{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.xqm-selname{font-size:15px;font-weight:800;color:var(--fg)}
.xqm-selsub{font-size:11.5px;color:var(--muted);margin-top:2px}
.xqm-s2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.xqm-s2 .s{background:var(--soft);border-radius:9px;padding:8px 10px}
.xqm-s2 .s .k{font-size:10.5px;color:var(--muted);letter-spacing:.05em}
.xqm-s2 .s .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg)}
.xqm-s2 .s.hp .v{color:var(--xqm-hp-full)}
.xqm-s2 .s.atk .v{color:var(--xqm-red-lt)}
.xqm-trait{border-radius:10px;padding:10px 12px;
  background:linear-gradient(135deg,rgba(201,162,39,.14),rgba(201,162,39,.05));
  border:1px solid rgba(201,162,39,.4)}
.xqm-trait .t{font-size:12px;font-weight:800;color:var(--xqm-gold-dk);letter-spacing:.05em;margin-bottom:4px}
.xqm-trait .d{font-size:12px;line-height:1.7;color:var(--fg)}
.xqm-trait .on{color:var(--xqm-hp-full);font-weight:700}
html[data-theme="dark"] .xqm-trait .t{color:var(--xqm-gold-lt)}

/* ══ 首页两栏 ══ */
.xqm-home{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;margin:18px 0;align-items:start}
.xqm-hleft{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.xqm-hboard{--cw:56px;--ch:54px;--bpx:16px;--bpy:14px;--gw:1.1px;display:grid;position:relative;
  grid-template-columns:repeat(9,var(--cw));grid-template-rows:repeat(5,var(--ch));
  padding:var(--bpy) var(--bpx);border-radius:14px;
  background-image:
    repeating-linear-gradient(88deg,rgba(150,115,70,.055) 0 1px,transparent 1px 25px),
    linear-gradient(168deg,var(--xqm-wood1),var(--xqm-wood2) 55%,var(--xqm-wood3));
  background-repeat:no-repeat;
  box-shadow:inset 0 0 0 2px rgba(120,90,50,.35),0 14px 32px rgba(90,70,40,.2)}
.xqm-hboard .xqm-cell{display:grid;place-items:center;position:relative}
.xqm-board .xqm-cell::before,.xqm-hboard .xqm-cell::before,.xqm-mb .xqm-cell::before{
  content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:var(--xqm-grid,rgba(110,82,48,.42));pointer-events:none}
.xqm-board .xqm-cell::after,.xqm-hboard .xqm-cell::after,.xqm-mb .xqm-cell::after{
  content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;
  background:var(--xqm-grid,rgba(110,82,48,.42));pointer-events:none}
.xqm-hboard .xqm-pc{--sz:calc(var(--cw) - 6px);cursor:default}
.xqm-hboard .xqm-palace.p1{top:calc(var(--bpy) + var(--ch)*2.5)}
.xqm-hcap{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.xqm-hcap a{color:var(--xqm-gold-dk);font-weight:700;text-decoration:none}
.xqm-hright{display:flex;flex-direction:column;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:22px 20px;position:relative;overflow:hidden}
.xqm-hright::before{content:"";position:absolute;top:-40px;right:-40px;width:150px;height:150px;
  border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.12),transparent 65%);pointer-events:none}
.xqm-hright .xqm-badge{align-self:flex-start}
.xqm-hright h1{margin:6px 0 8px;font-size:30px;font-weight:800;letter-spacing:.12em;
  font-family:"Songti SC","STSong","SimSun",serif;color:var(--fg)}
.xqm-hright .xqm-sub{margin:0 0 14px;font-size:13px;line-height:1.9;color:var(--fg-2)}
.xqm-hbtns{display:flex;flex-direction:column;gap:10px}
.xqm-hbtns .xqm-btn{width:100%;padding:13px 18px;font-size:14.5px;justify-content:space-between}
.xqm-hbtns .xqm-btn .arr{opacity:.65;font-weight:400}
.xqm-hbtns .xqm-btn:disabled .arr{display:none}
.xqm-hbtns .xqm-tag{font-size:10.5px;font-weight:600;color:var(--xqm-gold-dk);
  background:rgba(201,162,39,.14);border:1px solid rgba(201,162,39,.4);
  border-radius:20px;padding:2px 9px;letter-spacing:.05em}
@media (max-width:900px){
  .xqm-home{grid-template-columns:1fr}
  .xqm-hright{order:-1}
}

/* ══ 编辑阵容 ══ */
.xqm-lu{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin:16px 0;align-items:start}
.xqm-lu-left{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.xqm-lu-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.xqm-lu-head h2{margin:0;font-size:19px;color:var(--fg)}
.xqm-lu-head .tip{font-size:12.5px;color:var(--muted)}
.xqm-lu-right{display:flex;flex-direction:column;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:18px 16px}
.xqm-lu-right h3{margin:0 0 4px;font-size:13px;color:var(--muted);letter-spacing:.07em}
.xqm-luitem{display:flex;align-items:center;gap:11px;padding:7px 10px;
  border:1px solid var(--line);border-radius:12px;background:var(--bg-elev,transparent);
  cursor:pointer;transition:border-color .18s,box-shadow .18s;user-select:none}
.xqm-luitem.on{border-color:var(--xqm-gold);box-shadow:0 0 0 2px rgba(201,162,39,.22)}
.xqm-luitem.empty{opacity:.38;cursor:not-allowed}
.xqm-luitem .nm{font-size:13.5px;color:var(--fg);font-weight:600}
.xqm-luitem .rl{font-size:11px;color:var(--muted)}
.xqm-luitem .n{margin-left:auto;font-size:12.5px;color:var(--xqm-gold-dk);font-weight:700;
  font-variant-numeric:tabular-nums}
.xqm-lucan{position:absolute;inset:26%;border-radius:50%;
  border:2px dashed rgba(78,168,112,.75);z-index:2;pointer-events:none;
  animation:xqmHl .26s cubic-bezier(.34,1.56,.64,1) both}
.xqm-lu-board .xqm-cell{cursor:pointer}
.xqm-lufoot{display:flex;gap:10px;margin-top:14px}
.xqm-lufoot .xqm-btn{flex:1}
@media (max-width:900px){
  .xqm-lu{grid-template-columns:1fr}
  .xqm-lu-right{order:-1}
}

/* ══ 结算 ══ */
.xqm-result,#xqmResult{min-height:60vh;display:grid;place-items:center;padding:30px 20px}
.xqm-rbox{max-width:540px;width:100%;text-align:center;margin:0 auto}
.xqm-verdict{font-size:46px;font-weight:900;letter-spacing:.15em;margin:0 0 8px;
  font-family:"Songti SC","STSong",serif;animation:xqmVer .65s cubic-bezier(.2,1.4,.4,1) both}
@keyframes xqmVer{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
.xqm-verdict.win{background:linear-gradient(178deg,#D0483F,var(--xqm-red-dk));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.xqm-verdict.lose{background:linear-gradient(178deg,#3A6B57,var(--xqm-green-dk));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.xqm-verdict.draw{background:linear-gradient(178deg,var(--xqm-gold-lt),var(--xqm-gold-dk));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.xqm-why{color:var(--muted);font-size:13.5px;letter-spacing:.06em;margin-bottom:26px}
.xqm-rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:22px;text-align:left;margin-bottom:20px}
.xqm-rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:11px}
.xqm-rgrid .g{background:var(--soft);border-radius:11px;padding:12px;text-align:center}
.xqm-rgrid .g .k{font-size:11px;color:var(--muted);letter-spacing:.05em;margin-bottom:5px}
.xqm-rgrid .g .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg)}
.xqm-rgrid .g .v.up{color:var(--xqm-hp-full)}
.xqm-rgrid .g .v.down{color:var(--xqm-red-lt)}
.xqm-racts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.xqm-rloot{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px 22px;margin-bottom:20px}
.xqm-rloot .lt{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:10px}
.xqm-rloot .ls{display:flex;flex-wrap:wrap;gap:10px}
.xqm-rloot .li{display:inline-flex;align-items:center;gap:8px;background:var(--soft);
  border-radius:11px;padding:8px 12px}
.xqm-rloot .li .g{font-family:"KaiTi","STKaiti","楷体",serif;font-weight:700;font-size:16px;
  color:#FFF8E7;background:radial-gradient(circle at 34% 26%,#D0483F,#A52222 44%,#6E0F0F);
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.5px rgba(201,162,39,.85)}
.xqm-rloot .li .nm2{font-size:13px;font-weight:700;color:var(--fg)}
.xqm-rloot .li .cnt{font-size:13px;font-weight:800;color:var(--xqm-gold-dk);font-variant-numeric:tabular-nums}
.xqm-ryizhu{display:none;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:13px 22px;margin-bottom:20px}
.xqm-ryizhu .yz-ico{font-size:13px;font-weight:800;letter-spacing:.2em;color:var(--fg)}
.xqm-ryizhu .yz-gain{font-size:19px;font-weight:900;color:var(--xqm-gold-dk);font-variant-numeric:tabular-nums}
.xqm-ryizhu .yz-bal{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.xqm-verdict{animation:xqmVerdictIn .52s cubic-bezier(.2,1.3,.4,1) both}
@keyframes xqmVerdictIn{from{opacity:0;transform:scale(.62) translateY(20px)}
  to{opacity:1;transform:none}}
.xqm-why{animation:xqmIn .4s var(--ease) .2s both}
.xqm-rcard{animation:xqmIn .42s var(--ease) .3s both}
.xqm-rgrid .g{animation:xqmStatIn .36s var(--spring) both}
@keyframes xqmStatIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
.xqm-rloot{animation:xqmIn .4s var(--ease) both}
.xqm-rloot .li{animation:xqmLootIn .5s var(--spring) both}
@keyframes xqmLootIn{from{opacity:0;transform:translateY(16px) rotate(-7deg) scale(.78)}
  to{opacity:1;transform:none}}
.xqm-ryizhu{animation:xqmIn .4s var(--ease) both}
.xqm-racts{animation:xqmIn .4s var(--ease) .5s both}
.xqm-ltres{display:flex;justify-content:center;margin-bottom:14px}
.xqm-ltres .lt-card{display:flex;flex-direction:column;align-items:center;gap:7px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 26px;
  animation:xqmHl .3s cubic-bezier(.34,1.4,.64,1) both}
.xqm-ltres .lt-cgrade{font-size:11px;font-weight:800;letter-spacing:.3em}
.xqm-ltres .lt-cname{font-size:14px;font-weight:800;color:var(--fg);letter-spacing:.1em}
.xqm-ltres .lt-cgain{font-size:12.5px;font-weight:700;color:var(--xqm-gold-dk);
  font-variant-numeric:tabular-nums}

/* ══ 榜单 / 图鉴 ══ */
/* 页面头：返回 + 标题 + 右侧附注（各页统一） */
.xqm-head{display:flex;align-items:center;gap:12px;margin:0 0 18px;min-width:0}
.xqm-head h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.16em;
  font-family:var(--xqm-f-serif);color:var(--fg);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xqm-hsub{margin-left:auto;font-size:12.5px;color:var(--muted);
  white-space:nowrap;font-variant-numeric:tabular-nums}

/* 图鉴顶部的抽赏入口条 */
.xqm-promo{display:flex;align-items:center;gap:14px;margin:0 0 20px;
  padding:13px 16px;border-radius:var(--r2);min-width:0;
  background:linear-gradient(135deg,rgba(201,162,39,.14),rgba(201,162,39,.04));
  border:1px solid rgba(201,162,39,.4)}
.xqm-promo-tx{min-width:0;flex:1 1 auto}
.xqm-promo b{display:block;font-size:14px;font-weight:800;color:var(--fg);letter-spacing:.06em}
.xqm-promo span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.xqm-promo em{display:block;font-size:11px;color:var(--xqm-gold-dk);font-style:normal;
  margin-top:5px;font-variant-numeric:tabular-nums}
html[data-theme="dark"] .xqm-promo em{color:var(--xqm-gold-lt)}

/* 结算页动作区：主按钮独占一行，次要按钮排在下面 */
.xqm-racts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.xqm-racts-main{flex:1 1 100%}

/* 匹配页：无人提示 + 底部动作 */
.xqm-mask{margin-top:18px}
.xqm-mask .t{margin:0 0 6px;font-size:14px;color:var(--fg)}
.xqm-mask .d{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.8}
.xqm-mask .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.xqm-mfoot{margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* 阵容页 */
.xqm-lu-tip{font-size:12px;color:var(--muted);text-align:center;line-height:1.7;margin-top:10px}
.xqm-lu-rhead{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.xqm-vol{-webkit-appearance:none;appearance:none;width:150px;height:26px;background:none;
  cursor:pointer;flex-shrink:0}
.xqm-vol::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:var(--n2)}
.xqm-vol::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:17px;height:17px;
  margin-top:-6px;border-radius:50%;background:var(--xqm-gold);
  box-shadow:0 1px 5px rgba(90,70,40,.35)}
.xqm-vol::-moz-range-track{height:5px;border-radius:99px;background:var(--n2)}
.xqm-vol::-moz-range-thumb{width:17px;height:17px;border:0;border-radius:50%;background:var(--xqm-gold)}

.xqm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:11px;margin-bottom:22px}
.xqm-stats .g{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:15px;text-align:center}
.xqm-stats .g .k{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.xqm-stats .g .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg)}
.xqm-tbl{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.xqm-trow{display:flex;align-items:center;gap:12px;padding:13px 16px;
  border-bottom:1px solid var(--line);font-size:13.5px;color:var(--fg)}
.xqm-trow:last-child{border-bottom:none}
.xqm-trow.me{background:rgba(201,162,39,.1);font-weight:700}
.xqm-trow .rk{width:30px;text-align:center;font-weight:800;color:var(--muted);
  font-variant-numeric:tabular-nums}
.xqm-trow .rk.top{color:var(--xqm-gold-dk)}
.xqm-trow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xqm-trow .rt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--xqm-gold-dk)}
.xqm-trow .wl{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.xqm-cdx{display:flex;flex-direction:column;gap:16px}
.xqm-cdx-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.xqm-cdx-info{border-radius:18px;padding:21px;
  background:linear-gradient(180deg,rgba(255,252,244,.97),var(--card));
  border:1px solid rgba(201,162,39,.32);
  box-shadow:0 2px 14px rgba(90,60,20,.07),inset 0 1px 0 rgba(255,255,255,.7)}
html[data-theme="dark"] .xqm-cdx-info{
  background:linear-gradient(180deg,rgba(56,48,40,.9),var(--card));
  border-color:rgba(201,162,39,.28)}
.xqm-cdx-head{display:flex;align-items:center;gap:15px;padding-bottom:15px;
  border-bottom:1px solid transparent;
  border-image:linear-gradient(90deg,transparent,rgba(201,162,39,.5),transparent) 1}
.xqm-cdx-head .nm{font-size:23px;font-weight:800;letter-spacing:.07em;color:var(--fg);
  font-family:"Songti SC","STSong",serif}
.xqm-cdx-head .sub{font-size:11.5px;color:var(--muted);margin-top:5px;letter-spacing:.08em}
.xqm-cdx-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}
.xqm-cdx-nums .s{border-radius:10px;padding:10px 5px;text-align:center;
  background:linear-gradient(180deg,rgba(201,162,39,.11),rgba(201,162,39,.03));
  border:1px solid rgba(201,162,39,.22)}
.xqm-cdx-nums .s .k{font-size:10px;color:var(--muted);margin-bottom:4px}
.xqm-cdx-nums .s .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg)}
.xqm-cdx-rows{font-size:12.5px;line-height:1.95}
.xqm-cdx-rows .r{display:flex;gap:9px;padding:5px 0;border-top:1px dashed var(--line)}
.xqm-cdx-rows .r:first-child{border-top:none}
.xqm-cdx-rows .r .lb{color:var(--muted);flex-shrink:0;width:54px}
.xqm-cdx-rows .r .vl{flex:1;min-width:0;color:var(--fg)}
.xqm-cdx-rows .r .vl b{color:var(--xqm-gold-dk)}
html[data-theme="dark"] .xqm-cdx-rows .r .vl b{color:var(--xqm-gold-lt)}

.xqm-demo{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;overflow:hidden}
/* 两栏在窄屏堆叠 */
@media (max-width:1080px){
  .xqm-cdx-main{grid-template-columns:minmax(0,1fr)}
}
.xqm-demo-tabs{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap}
.xqm-demo-tab{font-size:12.5px;font-weight:700;padding:7px 16px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:var(--soft);color:var(--muted);font-family:inherit;
  letter-spacing:.04em;transition:color .18s ease,border-color .18s ease,box-shadow .18s ease}
.xqm-demo-tab:hover{color:var(--fg)}
.xqm-demo-tab.on{background:var(--card);color:var(--fg);border-color:rgba(201,162,39,.8);
  box-shadow:0 2px 10px var(--shadow)}
.xqm-demo .hint{font-size:11.5px;color:var(--muted);line-height:1.75;margin-bottom:11px}
.xqm-demo .body{display:flex;flex-direction:column;align-items:stretch;gap:12px}
.xqm-demo .res{min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12.5px;line-height:1.6;color:var(--fg);
  border-top:1px dashed var(--line);padding-top:10px}
.xqm-demo .res .big{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;
  color:var(--xqm-red-lt);line-height:1.25}
.xqm-demo .res .note{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:99px;
  background:rgba(201,162,39,.16);color:var(--xqm-gold-dk);margin:3px 4px 0 0}
html[data-theme="dark"] .xqm-demo .res .note{color:var(--xqm-gold-lt)}
.xqm-demo .res .dim{color:var(--muted)}
.xqm-demo .res .ln{display:inline-flex;align-items:center;gap:4px}
.xqm-demo .tools{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.xqm-demo .tool{font-size:11.5px;padding:6px 14px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--soft);color:var(--fg);font-family:inherit;
  transition:transform .15s ease}
.xqm-demo .tool:hover{transform:translateY(-1px)}

/* ⚠️ align-self:center 不能删：.xqm-demo .body 是 align-items:stretch 的竖排 flex，
   木板会被拉满整栏宽，而网格的列是 auto —— 于是每列被撑到 2 倍格宽，
   棋子之间横向空出一大截，竖线全断掉。木板必须贴合棋盘自身的宽度再居中。 */
.xqm-mb{--cw:56px;--ch:54px;--bpx:16px;--bpy:14px;position:relative;flex-shrink:0;
  align-self:center;
  border-radius:14px;padding:var(--bpy) var(--bpx);
  background-image:
    repeating-linear-gradient(88deg,rgba(150,115,70,.055) 0 1px,transparent 1px 25px),
    linear-gradient(168deg,var(--xqm-wood1),var(--xqm-wood2) 55%,var(--xqm-wood3));
  background-repeat:no-repeat;
  box-shadow:inset 0 0 0 2px rgba(120,90,50,.35),0 14px 32px rgba(90,70,40,.2)}
.xqm-mb-grid{display:grid;justify-content:center}
.xqm-mb .xqm-cell{width:var(--cw);height:var(--ch);position:relative;display:grid;place-items:center;
  cursor:pointer}
.xqm-mb .xqm-cell:hover{background:rgba(255,248,225,.2)}
.xqm-mb .xqm-pc{--sz:calc(var(--cw) - 6px)}
.xqm-mb .xqm-pc.xqm-sel::after{inset:-4px;border-width:2px}
.xqm-mb .xqm-hl{position:absolute;inset:2px;border-radius:6px;pointer-events:none}
.xqm-mb .xqm-hl.mv{background:rgba(58,140,92,.36);box-shadow:inset 0 0 0 2px rgba(96,200,140,.85)}
.xqm-mb .xqm-hl.rng{background:rgba(201,162,39,.22);box-shadow:inset 0 0 0 2px rgba(201,162,39,.9)}
.xqm-mb .xqm-hl.both{background:rgba(201,162,39,.32);box-shadow:inset 0 0 0 2px rgba(201,162,39,.95)}
.xqm-mb .xqm-hl.aura{background:rgba(176,42,42,.18);box-shadow:inset 0 0 0 2px rgba(200,70,70,.7)}
.xqm-mb .xqm-hl.heal{background:rgba(58,180,120,.18);box-shadow:inset 0 0 0 2px rgba(96,220,150,.9)}
.xqm-mb .xqm-hot{position:absolute;inset:1px;border-radius:7px;pointer-events:none;
  box-shadow:0 0 0 2px rgba(201,162,39,.95);animation:xqmHot 1.35s ease-in-out infinite}
@keyframes xqmHot{0%,100%{opacity:.4}50%{opacity:1}}
.xqm-mb .xqm-mbdmg{position:absolute;left:50%;top:35%;font-size:16px;font-weight:900;
  pointer-events:none;z-index:9;
  color:#FFE9A8;text-shadow:0 0 7px rgba(255,120,60,.95),0 1px 3px #000;
  animation:xqmDmg 1.05s cubic-bezier(.2,.7,.3,1) forwards}

.xqm-cdx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px}
.xqm-cdx-group{margin-bottom:22px}
.xqm-cdx-card{position:relative;background:var(--gc-bg);border:1px solid var(--gc-bd)}
.xqm-cdx-card .badge{position:absolute;top:7px;left:7px;font-size:10px;font-weight:800;
  letter-spacing:.1em;padding:2px 8px;border-radius:999px;border:1px solid;line-height:1.5}
.xqm-cdx-card .lock{position:absolute;top:7px;right:7px;font-size:15px;line-height:1;
  filter:none;opacity:.9}
.xqm-cdx-card.lk{filter:grayscale(1);opacity:.5}
.xqm-cdx-card.lk:hover{transform:none;opacity:.62;cursor:pointer;
  box-shadow:0 2px 10px rgba(90,60,20,.06),inset 0 1px 0 rgba(255,255,255,.7);
  border-color:var(--line)}
.xqm-cdx-card.lk::after{opacity:.18}
.xqm-cdx-card .sh.lk{color:#b42318}
.xqm-cdx-ghead{display:flex;align-items:center;gap:9px;margin:0 0 10px}
.xqm-cdx-ghead .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.xqm-cdx-ghead .gn{font-size:14px;font-weight:800;letter-spacing:.18em}
.xqm-cdx-ghead .gc{font-size:11px;color:var(--muted);letter-spacing:.05em}
.xqm-cdx-empty{border:1px dashed var(--line);border-radius:14px;padding:26px;
  text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:.1em}
.xqm-cdx-card{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;
  padding:26px 12px 18px;border-radius:16px;font-family:inherit;
  background:linear-gradient(180deg,var(--gc-bg),transparent 68%),var(--card);
  border:1px solid var(--gc-bd);
  box-shadow:0 2px 10px rgba(90,60,20,.06),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.xqm-cdx-card::after{content:'';position:absolute;left:16%;right:16%;bottom:0;height:2px;
  border-radius:2px;background:linear-gradient(90deg,transparent,var(--gc),transparent);opacity:.55}
.xqm-cdx-card:hover{transform:translateY(-5px);border-color:var(--gc);
  box-shadow:0 14px 32px rgba(90,60,20,.17),inset 0 1px 0 rgba(255,255,255,.7)}
.xqm-cdx-card .xqm-pc{--sz:66px}
.xqm-cdx-card .nm{font-size:15px;font-weight:800;color:var(--fg);letter-spacing:.06em;
  font-family:"Songti SC","STSong",serif}
.xqm-cdx-card .st{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.xqm-grade{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.14em;
  border:1px solid;border-radius:20px;padding:2px 9px;line-height:1.5;
  white-space:nowrap;vertical-align:1px}
/* 对局棋盘上不显示等级（只在入场动画期间淡入 + 状态面板里显示） */
body.xqm-bt-page .xqm-pc .xqm-lv{display:none}
body.xqm-bt-page.xqm-intro .xqm-pc .xqm-lv{display:block;animation:xqmIntroLv .5s ease both}
@keyframes xqmIntroLv{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 入场：棋子依次落下（animation-delay 由 JS 按顺序设置） */
@keyframes xqmIntroPc{
  0%{opacity:0;transform:translateY(-30px) scale(.55)}
  62%{opacity:1;transform:translateY(3px) scale(1.07)}
  100%{opacity:1;transform:none}}
body.xqm-bt-page.xqm-intro .xqm-pc{animation:xqmIntroPc .52s cubic-bezier(.22,1,.36,1) both}
html[data-xqm-motion="0"] body.xqm-bt-page.xqm-intro .xqm-pc{animation:none !important}
.xqm-pc .xqm-lv{position:absolute;right:4%;bottom:4%;z-index:6;font-style:normal;
  font-size:calc(var(--sz)*.19);font-weight:800;line-height:1;color:#FFEFC2;
  background:rgba(24,16,8,.78);border-radius:999px;padding:calc(var(--sz)*.03) calc(var(--sz)*.1);
  font-variant-numeric:tabular-nums;pointer-events:none;
  box-shadow:0 0 0 1px rgba(201,162,39,.55)}
.xqm-cdx-card .sh{font-size:11.5px;color:var(--xqm-gold-dk);font-variant-numeric:tabular-nums}
.xqm-grow{margin-top:15px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--soft)}
.xqm-grow .gh{display:flex;justify-content:space-between;align-items:baseline;
  font-size:12px;color:var(--muted);letter-spacing:.1em}
.xqm-grow .gh .lv{font-size:16px;font-weight:800;color:var(--fg);letter-spacing:0}
.xqm-grow .bar{height:8px;border-radius:99px;background:rgba(40,30,20,.14);overflow:hidden;margin:10px 0 6px}
.xqm-grow .bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#9C7A1F,#E0A93C);transition:width .3s ease}
.xqm-grow .gs{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.xqm-grow .up{margin:10px 0 0;width:100%;justify-content:center}
.xqm-grow .up:disabled{opacity:.45;cursor:not-allowed}
.xqm-grow .grows{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px}
.xqm-grow .grows .r{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg-2)}
.xqm-grow .grows em{font-style:normal;color:#3B9A5F;font-weight:700;margin-left:4px}
.xqm-grow .nt{margin-top:10px;font-size:12px;line-height:1.75;color:var(--muted);
  border-top:1px dashed var(--line);padding-top:10px}
.xqm-grow .nt b{color:var(--xqm-gold-dk)}
.xqm-grow .nt.lock{opacity:.62}
.xqm-hintbar{text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.8}
/* 超时判负预警：只剩 30 秒内出现，掉线回来能一眼看到自己快被判负 */
.xqm-towarn{position:sticky;top:8px;z-index:90;margin:0 auto 10px;max-width:min(460px,92vw);
  text-align:center;padding:9px 16px;border-radius:99px;
  font-size:13px;font-weight:700;color:#FFF6E0;
  background:var(--xqm-red-lt);box-shadow:0 4px 16px rgba(165,34,34,.34);
  animation:xqmWarnPulse 1.1s ease-in-out infinite}
@keyframes xqmWarnPulse{0%,100%{opacity:1}50%{opacity:.72}}

/* ══ 特效 ══ */
.xqm-fx{position:absolute;inset:0;pointer-events:none;z-index:20}
.xqm-dmg{position:absolute;font-size:25px;font-weight:900;pointer-events:none;z-index:30;
  font-family:"Songti SC","STSong",serif;color:#FFE9A8;
  text-shadow:0 0 8px rgba(255,120,60,.9),0 2px 4px rgba(0,0,0,.7),0 0 2px #000;
  animation:xqmDmg 1.05s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes xqmDmg{0%{opacity:0;transform:translate(-50%,0) scale(.5)}
  22%{opacity:1;transform:translate(-50%,-16px) scale(1.22)}
  45%{transform:translate(-50%,-26px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-66px) scale(.92)}}
.xqm-dmg.splash{font-size:17px;color:#FFC48A}
.xqm-dmg.combo{color:#FF8A3C;text-shadow:0 0 10px rgba(255,90,30,.95),0 2px 4px rgba(0,0,0,.7),0 0 2px #000}
.xqm-dmg.combo2{color:#FF5A2E}
.xqm-frag{position:absolute;border-radius:50%;pointer-events:none;z-index:25}
.xqm-trail{position:absolute;border-radius:50%;pointer-events:none;z-index:12;
  animation:xqmTrail .72s ease-out forwards}
@keyframes xqmTrail{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(.35)}}
@keyframes xqmBurst{0%{transform:scale(.18);opacity:1}52%{transform:scale(1.02);opacity:.95}
  100%{transform:scale(1.55);opacity:0}}
@keyframes xqmRing{0%{transform:scale(.28);opacity:1}100%{transform:scale(1.95);opacity:0}}
@keyframes xqmSpike{0%{transform:translate(0,0) scale(1.5);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(.28);opacity:0}}

/* 顶部提示 */
.xqm-toast{position:fixed;left:50%;top:74px;transform:translateX(-50%);z-index:1999;

/* ── 整体氛围：暖色底纹 + 全幅背景（内容收在约 60% 宽，两侧留白） ── */
.xqm{
  padding:20px 18px 32px;
  min-height:60vh;
  background:
    radial-gradient(1100px 520px at 50% -8%, rgba(201,162,39,.15), transparent 68%),
    radial-gradient(760px 380px at 8% 104%, rgba(160,42,42,.07), transparent 70%),
    repeating-linear-gradient(135deg, rgba(122,90,40,.03) 0 2px, transparent 2px 9px),
    linear-gradient(180deg,#F8F2E6 0%,#F1E7D5 46%,#E9DBC2 100%);
  border-top:1px solid rgba(201,162,39,.34);
  border-bottom:1px solid rgba(201,162,39,.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(122,90,40,.08);
}
.xqm::before{
  content:'';display:block;height:0;
}
html[data-theme="dark"] .xqm{
  background:
    radial-gradient(1100px 520px at 50% -8%, rgba(201,162,39,.12), transparent 68%),
    radial-gradient(760px 380px at 8% 104%, rgba(160,42,42,.10), transparent 70%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 2px, transparent 2px 9px),
    linear-gradient(180deg,#1D1A17 0%,#181512 52%,#12100E 100%);
  border-top-color:rgba(201,162,39,.30);
  border-bottom-color:rgba(201,162,39,.30);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
@media (max-width:900px){
  .xqm{padding:16px 14px 26px;min-height:auto}
}


/* ══ 棋子圆牌精修：镜面高光 + 金属圈 ══ */
.xqm-pc::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.36) 0%, rgba(255,255,255,.10) 24%, transparent 50%),
    radial-gradient(circle at 50% 118%, rgba(0,0,0,.34) 0%, transparent 56%);}
.xqm-pc.red{box-shadow:
  inset 0 0 0 1px rgba(255,238,190,.5),
  inset 0 0 0 3px rgba(201,162,39,.95),
  inset 0 0 0 4.5px rgba(58,18,10,.38),
  inset 0 4px 10px rgba(255,255,255,.26),
  inset 0 -7px 14px rgba(0,0,0,.46),
  0 4px 14px rgba(70,20,20,.40),
  0 1px 0 rgba(255,255,255,.16)}
.xqm-pc.black{box-shadow:
  inset 0 0 0 1px rgba(255,238,190,.42),
  inset 0 0 0 3px rgba(201,162,39,.9),
  inset 0 0 0 4.5px rgba(0,18,12,.42),
  inset 0 4px 10px rgba(255,255,255,.2),
  inset 0 -7px 14px rgba(0,0,0,.5),
  0 4px 14px rgba(10,30,24,.42),
  0 1px 0 rgba(255,255,255,.14)}

/* ══ 图鉴卡片入场：依次浮现，不是一起蹦出来 ══ */
@keyframes xqmCardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.xqm-cdx-grid > .xqm-cdx-card{animation:xqmCardIn .42s cubic-bezier(.22,1,.36,1) backwards}
.xqm-cdx-grid > .xqm-cdx-card:nth-child(1){animation-delay:.02s}
.xqm-cdx-grid > .xqm-cdx-card:nth-child(2){animation-delay:.07s}
.xqm-cdx-grid > .xqm-cdx-card:nth-child(3){animation-delay:.12s}
.xqm-cdx-grid > .xqm-cdx-card:nth-child(4){animation-delay:.17s}
.xqm-cdx-grid > .xqm-cdx-card:nth-child(5){animation-delay:.22s}
.xqm-cdx-grid > .xqm-cdx-card:nth-child(6){animation-delay:.27s}
.xqm-cdx-grid > .xqm-cdx-card:nth-child(7){animation-delay:.32s}
.xqm-cdx-grid > .xqm-cdx-card:nth-child(8){animation-delay:.37s}
.xqm-cdx-grid > .xqm-cdx-card:nth-child(n+9){animation-delay:.42s}

/* ══ 小锁：轻微呼吸，提示「这里有事要做」 ══ */
@keyframes xqmLockPulse{0%,100%{opacity:.82;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
.xqm-cdx-card .lock{animation:xqmLockPulse 2.4s ease-in-out infinite}

/* ══ 品质角标：一道极淡的掠光 ══ */
@keyframes xqmBadgeSheen{0%{background-position:-140% 0}100%{background-position:240% 0}}
.xqm-cdx-card .badge{overflow:hidden}
.xqm-cdx-card .badge::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);
  background-size:220% 100%;animation:xqmBadgeSheen 3.6s ease-in-out infinite}

/* ══ 按钮按下：更像实体键 ══ */
.xqm-btn{will-change:transform}
.xqm-btn:active{transform:translateY(1px) scale(.972);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.28) !important}

/* ══ 动效总开关：关掉时全部静止 ══ */
html[data-xqm-motion="0"] .xqm-cdx-grid > .xqm-cdx-card,
html[data-xqm-motion="0"] .xqm-cdx-card .lock,
html[data-xqm-motion="0"] .xqm-cdx-card .badge::after{animation:none !important}
html[data-xqm-motion="0"] .xqm-cdx-card .badge::after{display:none}
html[data-xqm-motion="0"] .xqm-ltp-card.in::after{display:none}

@media (prefers-reduced-motion: reduce){
  .xqm *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
}

/* ══════════════════════════════════════════
   强制横屏布局
   写在所有媒体查询之后：舞台已经是横屏尺寸，
   这里要把 max-width:900px 那套竖屏单栏规则全部顶掉，
   恢复成横屏该有的两栏 / 三栏，且高度必须刚好铺满不出现滚动条。
   高度用舞台变量算，不看视口 —— 因为竖屏时视口是竖的。
   舞台本体的 fixed / 尺寸 / 安全区 padding 定义在本文件后段「舞台基础样式」那一处，
   这里只管内部怎么排，避免同一条规则写两遍互相覆盖。
   ══════════════════════════════════════════ */
/* 页头在横屏里只留标题，别把高度吃掉 */
html[data-xqm-land="1"] .xqm-title{font-size:19px;margin:0 0 4px;flex:0 0 auto}
html[data-xqm-land="1"] .xqm-toast{top:10px;font-size:12.5px}

/* ── 首页 / 阵容页：左棋盘 + 右栏 ──
   横屏下别用 minmax(0,1fr) 给左列预留固定比例 —— 竖屏转横屏后
   短边（=舞台高）才是棋盘的瓶颈，左列再宽也只是把棋盘晾在中间，
   右边空一大片看着像少了一列。
   改成：左列按棋盘实际需要（内容宽），右栏吃掉剩下的但封顶 320，
   免得 6 个按钮摊成两列铺满半屏、画面发虚。 */
html[data-xqm-land="1"] .xqm-home,
html[data-xqm-land="1"] .xqm-lu{
  grid-template-columns:auto minmax(0,296px);
  justify-content:center;
  gap:14px;margin:0;flex:1 1 auto;min-height:0;
  align-items:stretch;
}
/* 左列必须能收缩：里面的提示文字和棋子列表都很长，
   不给 min-width:0 的话 grid 子项会被内容顶开、把右栏推出画面。 */
html[data-xqm-land="1"] .xqm-lu-left,
html[data-xqm-land="1"] .xqm-hleft{min-width:0;overflow:hidden}
html[data-xqm-land="1"] .xqm-lu-head{gap:8px;min-width:0}
html[data-xqm-land="1"] .xqm-lu-head h2{font-size:15px}
html[data-xqm-land="1"] .xqm-lu-head .tip{
  font-size:10.5px;line-height:1.5;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
html[data-xqm-land="1"] .xqm-lu-left{height:100%;min-height:0;gap:6px}
html[data-xqm-land="1"] .xqm-hleft{
  min-height:0;gap:6px;justify-content:center;
  align-items:center;height:100%;
  /* 宽由棋盘自己决定，不反过来限制它 */
  width:auto;max-width:none;overflow:visible;
}
html[data-xqm-land="1"] .xqm-hright,
html[data-xqm-land="1"] .xqm-lu-right{
  order:0;position:static;top:auto;
  max-height:none;height:100%;
  /* 上下左右都收进容器 —— 之前只写 overflow-y，
     内容超宽时会顶出去，把舞台横向撑出 40px（棋盘右边被切掉一列）。 */
  overflow:auto;overscroll-behavior:contain;
  padding:10px 14px;border-radius:12px;
  min-width:0;
  /* 横屏是「宽而矮」的形状，右栏纵向堆到 593px 只有 376px 可视，
     光靠滚动很难用。改成三列网格：战绩 / 资产 / 成就各占一格，
     徽标标题横跨、按钮横跨。一屏塞下所有东西，不用滚。 */
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-auto-rows:min-content;
  align-content:start;
  gap:8px 12px;
  scrollbar-width:none;
}
/* 成就墙在横屏下已隐藏，第三列空着 → 改成两列，资产块内部两张卡竖排 */
html[data-xqm-land="1"] .xqm-hright{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-xqm-land="1"] .xqm-hassets{flex-direction:column;gap:6px}
/* 阵容页右栏是「标题 / 棋子库 / 按钮」的竖向堆叠，必须是单列 ——
   套三列网格会把按钮挤进窄列，文字被迫竖排 */
html[data-xqm-land="1"] .xqm-lu-right{grid-template-columns:minmax(0,1fr)}
/* 徽标、主标题、按钮组横跨三列 */
html[data-xqm-land="1"] .xqm-hright > .xqm-badge,
html[data-xqm-land="1"] .xqm-hright > h1,
html[data-xqm-land="1"] .xqm-lu-right > .xqm-badge,
html[data-xqm-land="1"] .xqm-lu-right > h1,
html[data-xqm-land="1"] .xqm-hbtns{grid-column:1 / -1}
/* 竖排那些子块在横屏下就是普通网格项，宽度交给 grid */
html[data-xqm-land="1"] .xqm-hright > *,
html[data-xqm-land="1"] .xqm-lu-right > *{max-width:100%;min-width:0;width:auto}
html[data-xqm-land="1"] .xqm-hright h1{font-size:19px;margin:0}
html[data-xqm-land="1"] .xqm-hright .xqm-sub{display:none}
/* 按钮组：右栏已经两列了，组内必须单列 ——
   每格只有 137px，两列放按钮的话 4 个汉字会被压成竖排（旋转后尤其明显）。 */
html[data-xqm-land="1"] .xqm-hbtns{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
}
html[data-xqm-land="1"] .xqm-hbtns > .xqm-btn:first-child{grid-column:1 / -1}
html[data-xqm-land="1"] .xqm-hach{display:none}
html[data-xqm-land="1"] .xqm-hstat .bar{margin:5px 0 4px}
html[data-xqm-land="1"] .xqm-hbtns .xqm-btn{

}
html[data-xqm-land="1"] .xqm-hbtns .xqm-btn .arr{display:none}
html[data-xqm-land="1"] .xqm-hbtns .xqm-tag{font-size:10px;padding:1px 6px}
/* 舞台是固定高度的 flex 列，子区域必须自己滚 —— 否则内容被 .xqm{overflow:hidden} 裁掉。
   两栏页还要把行高钉死（grid-template-rows:minmax(0,1fr)），
   不然 auto 行会被内容撑高，height:100% 解析不出确定值，overflow 就失效。 */
html[data-xqm-land="1"] .xqm-home,
html[data-xqm-land="1"] .xqm-lu{grid-template-rows:minmax(0,1fr)}
html[data-xqm-land="1"] .xqm-hright,
html[data-xqm-land="1"] .xqm-lu-right,
html[data-xqm-land="1"] .xqm-set,
html[data-xqm-land="1"] .xqm-rbox,
html[data-xqm-land="1"] .xqm-ltp,
html[data-xqm-land="1"] .xqm-mbox,
html[data-xqm-land="1"] .xqm-cdx,
html[data-xqm-land="1"] .xqm-rp,
html[data-xqm-land="1"] .xqm-cdx-info,
html[data-xqm-land="1"] .xqm-demo,
html[data-xqm-land="1"] .xqm-szn-hist{

html[data-xqm-land="1"] .xqm-hnote{font-size:11.5px;line-height:1.6}
html[data-xqm-land="1"] .xqm-stats{gap:6px}
html[data-xqm-land="1"] .xqm-stats .g{padding:7px 8px}
html[data-xqm-land="1"] .xqm-stats .v{font-size:18px}
html[data-xqm-land="1"] .xqm-stats .k{font-size:10.5px}
/* 战绩/资产块在右栏被切成了 1/3 宽，30px 大数字和 pill 标签都会撑破格子 */
html[data-xqm-land="1"] .xqm-hstat .big{font-size:20px}
html[data-xqm-land="1"] .xqm-hstat .row{gap:6px;margin-bottom:5px}
html[data-xqm-land="1"] .xqm-hstat,
html[data-xqm-land="1"] .xqm-hassets,
html[data-xqm-land="1"] .xqm-hach{padding:8px 9px;margin-bottom:0}
html[data-xqm-land="1"] .xqm-hach{gap:4px}
html[data-xqm-land="1"] .xqm-hach .b{padding:3px 7px;font-size:10px;gap:3px}
html[data-xqm-land="1"] .xqm-hassets .g,
html[data-xqm-land="1"] .xqm-stats .g{padding:5px 6px}

/* ── 对局页：横屏的主战场 ── */
html[data-xqm-land="1"] .xqm-bt{
  --btnav:0px;--btbot:0px;
  flex:1 1 auto;
  height:auto;min-height:0;
  display:grid;
  /* 顶栏/底栏压到最薄，把纵向空间全留给棋盘 —— 横屏 390px 里
     每省 10px，棋子就能大一圈 */
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:4px;
}
html[data-xqm-land="1"] .xqm-bt-top,
html[data-xqm-land="1"] .xqm-bt-bot{
