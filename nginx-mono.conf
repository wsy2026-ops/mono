# MONO 社区 · Nginx 反向代理配置
# ============================================================
# 部署位置：/etc/nginx/sites-available/mono
# 启用方式：ln -s /etc/nginx/sites-available/mono /etc/nginx/sites-enabled/mono
#
# 架构（两种入口并存，DNS 切换时不需要改配置）：
#   A. 访客 → Cloudflare（橙云）→ Nginx :443 → waitress 127.0.0.1:8080
#   B. 访客 → Nginx :443（灰云，CF 免费版给大陆分配的节点在美西，绕路严重）
#   · 应用只绑回环，外部无法绕过 Nginx
#
# ⚠️ 代理层数：guard_TRUSTED_PROXY_DEPTH = 2（CF + Nginx）
#   入口 B 直连时只有一层代理，但应用侧仍按 2 层解析，
#   拿到的会是 127.0.0.1 —— 灰云前要确认 IP 记录正确。
#
# ⚠️ 证书：橙云时用 Cloudflare Origin CA（mono-origin.crt），
#   浏览器不信任它。切灰云前必须换 Let's Encrypt（mono-direct.crt/key）。
#
#   共享的 location 规则在 /etc/nginx/snippets/mono-locations.conf。
# ============================================================

upstream mono_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

# 单 IP 并发连接上限：拦「一个来源开几百条连接」这类耗尽型攻击
limit_conn_zone $binary_remote_addr zone=mono_conn:10m;

# 单 IP 请求速率：50r/s，与应用的 GLOBAL_PER_MIN=3000 对齐。
# 取这个值是因为棋类房间前端是 1 秒轮询，校园网多人同时下棋会叠加。
limit_req_zone $binary_remote_addr zone=mono_req:10m rate=50r/s;

# 访客用 HTTP 访问时要不要跳 HTTPS。
# 只看 X-Forwarded-Proto：明确是 http 才跳，裸请求不跳。
# 裸请求不跳是有意的 —— certbot 的 ACME 验证就是裸请求走 80，
# 不跳它才拿得到 challenge 文件。橙云时 CF 会注入这个头，所以照跳不误。
# ⚠️ nginx 1.18 的 if 不支持 && 组合条件，要多条件判断只能用 map。
map $http_x_forwarded_proto $mono_needs_https {
    default      0;
    "http"       1;
}

# ---------------- 旧域名：搬家页 ----------------
# mono-craft.cc.cd 被运营商按 SNI 做了 DPI 拦截，移动数据下 HTTPS 全端口断、
# 开 VPN 才通（2026-10-06 tcpdump 定案，伪造 RST 的 TTL 是 242，真实包是 45）。
# 换域名 mono-craft.de5.net 是唯一根治。这个块负责给还能访问到的用户一个落点。
#
# ⚠️ 这里返回 200 而不是 301：DPI 是按明文 SNI 匹配的，
#   跳转目标写死在响应体里由 JS 跳转，用户不被 SNI 拦的路径也能看到新地址。
#   用 301 的话浏览器会自己再请求 de5.net，多数情况下没问题，
#   但旧域名客户端池里仍有打不开 de5.net 的，留个手动可点的入口更稳。
server {
    listen 80;
    listen [::]:80;
    server_name mono-craft.cc.cd www.mono-craft.cc.cd;

    root /var/www/mono-moved;

    add_header X-Robots-Tag "noindex" always;

    location = / {
        try_files /cc-cd-moved.html =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 其余路径一律也给搬家页，别让老书签拿到 404 以为服务挂了
    location / {
        try_files /cc-cd-moved.html =404;
    }

    error_page 404 /cc-cd-moved.html;
}

# 旧域名的 HTTPS 落点。
#
# ⚠️ **必须存在这个块**，不能只靠把 cc.cd 从主 server 的 server_name 里摘掉：
#   主 server 是 `listen 443 default_server` 且 server_name 带 `_`，
#   `_` 会匹配任何没被别的块精确列出的名字 —— cc.cd 摘掉后请求落到 default_server，
#   也就是主站。搬家页只在 80 生效就是这个漏了 `_` 导致的。
#
# ⚠️ 证书是 mono-de5-full（只含 de5.net），所以浏览器会先弹
#   「证书域名不匹配」警告，点「高级 → 继续」就能看到搬家页。
#   换不到干净的 cc.cd 证书：它是被 DPI 按 SNI 拦的域名，
#   且 LE 签 cc.cd 也得先过 http-01（会被自己的 DPI 拦）。
#   警告是预期内的，不影响内容送达。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mono-craft.cc.cd www.mono-craft.cc.cd;

    ssl_certificate     /etc/letsencrypt/live/mono-de5-full/cert.pem;
    ssl_certificate_key /etc/letsencrypt/live/mono-de5-full/privkey.pem;
    ssl_protocols       TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         HIGH:!aNULL:!MD5:!kDHE;

    root /var/www/mono-moved;
    add_header X-Robots-Tag "noindex" always;

    location / {
        try_files /cc-cd-moved.html =404;
    }

    error_page 404 /cc-cd-moved.html;
}

# ---------------- HTTP（80）----------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ mono-craft.de5.net www.mono-craft.de5.net;

    # ACME 验证必须留在 80 上走 HTTP（certbot renew 用），不能跳 HTTPS
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 访客走 HTTP 时跳 HTTPS。判断在上面的 map 里。
    # ⚠️ 之前这里还有一条读 CF-Visitor 的 if（橙云时代加的）。
    #    灰云直连后 CF 不再注入这个头，而且它会连 ACME 验证请求一起跳走 ——
    #    certbot 就是裸请求走 80 的，被跳到 HTTPS 就拿不到 challenge 文件。
    #    CF 回源时会带 X-Forwarded-Proto，map 那条已经覆盖橙云场景。
    if ($mono_needs_https) {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 100m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;
    limit_conn mono_conn 40;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/mono-access.log;
    error_log  /var/log/nginx/mono-error.log;

    include /etc/nginx/snippets/mono-locations.conf;
}

# ---------------- HTTPS（443：CF 回源 + 访客直连共用）----------------
server {
    # ⚠️ 服务器是 nginx 1.18，http2 必须写在 listen 里（新版才支持 "http2 on;"）
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _ mono-craft.de5.net www.mono-craft.de5.net;

    ssl_certificate     /etc/letsencrypt/live/mono-de5-full/cert.pem;
    ssl_certificate_key /etc/letsencrypt/live/mono-de5-full/privkey.pem;
    # ⚠️ 灰云直连后 TLS 由源站终结，客户端五花八门（老 Android WebView、
    #    旧 Edge、部分国产浏览器内核）。OpenSSL 3.0.2 默认开 TLS 1.3，
    #    而 TLS 1.3 的 key_share 协商跟这些客户端不兼容，日志里一堆
    #    「SSL_do_handshake() failed (bad key share)」。
    #    之前经 Cloudflare 时是边缘终结 TLS，源站只见到 CF 的请求，碰不到这问题。
    # 只开 TLS 1.2：兼容性最好，握手略慢一点但绝不含这种坑。
    ssl_protocols       TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         HIGH:!aNULL:!MD5:!kDHE;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;
    limit_conn mono_conn 40;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/mono-access.log;
    error_log  /var/log/nginx/mono-error.log;

    include /etc/nginx/snippets/mono-locations.conf;
}

# ---------------- HTTPS 备用端口 8444 ----------------
# 为什么需要：国内运营商（尤其移动）在 443 上按 SNI 做 DPI，
# 认得出域名后直接 RST —— 浏览器报 ERR_CONNECTION_RESET，
# 而且请求根本到不了服务器（nginx 日志里看不到）。
# 实测同一时刻 http://域名 能开、https://域名 被重置。
# 换到非标准端口后 SNI 拦不到，链路就通了。
# 证书和 location 跟 443 完全共用，只是端口号不同。
server {
    listen 8444 ssl http2;
    listen [::]:8444 ssl http2;
    server_name _ mono-craft.de5.net www.mono-craft.de5.net;

    ssl_certificate     /etc/letsencrypt/live/mono-de5-full/cert.pem;
    ssl_certificate_key /etc/letsencrypt/live/mono-de5-full/privkey.pem;
    ssl_protocols       TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         HIGH:!aNULL:!MD5:!kDHE;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;
    limit_conn mono_conn 40;
    server_tokens off;

    # 安全响应头跟 443 保持一致
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/mono-access.log;
    error_log  /var/log/nginx/mono-error.log;

    include /etc/nginx/snippets/mono-locations.conf;
}
