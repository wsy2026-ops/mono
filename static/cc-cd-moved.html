<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="10;url=https://mono-craft.de5.net/">
<title>MONO 已搬家</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  background: #fafafa; color: #111;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; line-height: 1.6;
}
.box { width: 100%; max-width: 560px; }
.kicker {
  font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
  color: #999; margin-bottom: 14px;
}
h1 { font-size: 30px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 12px; }
.lead { font-size: 15px; color: #555; margin-bottom: 28px; }

.new {
  display: block; background: #fff; border: 1px solid #e3e3e3;
  border-radius: 10px; padding: 16px 18px; margin-bottom: 22px;
  text-decoration: none; color: inherit;
  transition: border-color .15s, box-shadow .15s;
}
.new:hover { border-color: #111; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.new .label { font-size: 11px; color: #999; letter-spacing: .1em; margin-bottom: 6px; }
.new .url {
  font-size: 17px; font-weight: 600; word-break: break-all;
  color: #111; letter-spacing: -.005em;
}

.why { font-size: 13px; color: #888; border-top: 1px solid #ececec; padding-top: 18px; }
.why p { margin-bottom: 8px; }
.why p:last-child { margin-bottom: 0; }
.why code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px; background: #f0f0f0; padding: 1px 5px; border-radius: 3px;
}
.back {
  display: inline-block; margin-top: 16px; font-size: 13px;
  color: #555; text-decoration: none; border-bottom: 1px solid #ccc;
}
.back:hover { color: #111; border-color: #111; }

.count {
  margin-top: 20px; font-size: 13px; color: #999;
  min-height: 20px;
}
@media (max-width: 480px) {
  h1 { font-size: 24px; }
  .new .url { font-size: 15px; }
}
</style>
</head>
<body>
<div class="box">
  <div class="kicker">MONO 社区</div>
  <h1>我们搬家了</h1>
  <p class="lead">旧域名在移动网络下无法访问，站点已迁到下面的新地址。</p>

  <a class="new" id="lnk" href="https://mono-craft.de5.net/">
    <div class="label">新地址</div>
    <div class="url">https://mono-craft.de5.net/</div>
  </a>

  <div class="why">
    <p>旧地址 <code>mono-craft.cc.cd</code> 的 HTTPS 已被运营商的网络设备按域名拦截，
       在移动数据下会直接断开，开 VPN 才能访问。换域名是唯一的解决办法。</p>
    <p>账号、数据、聊天记录全部保留在原处，登录信息不变。</p>
    <a class="back" href="https://mono-craft.de5.net/">直接前往新地址 →</a>
  </div>

  <div class="count" id="cd"></div>
</div>
<script>
var LINK = 'https://mono-craft.de5.net/';
var left = 10;
var el = document.getElementById('cd');
function tick() {
  el.textContent = left > 0 ? left + ' 秒后自动跳转' : '正在跳转…';
  if (left <= 0) { location.replace(LINK); return; }
  left--;
  setTimeout(tick, 1000);
}
tick();
</script>
</body>
</html>
