<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>陆柒工作室</title>
<style>
  :root{
    --navy:#04344c;
    --orange:#eb7f2d;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  .splash{
    position:relative;
    display:flex;flex-direction:column;align-items:center;
    padding:24px;
    width:100%;max-width:520px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  .glow{
    position:absolute;top:8%;left:50%;transform:translateX(-50%);
    width:min(86vw,420px);height:min(86vw,420px);border-radius:50%;
    background:radial-gradient(circle,rgba(235,127,45,.13) 0%,rgba(235,127,45,0) 68%);
    opacity:0;
  }

  .markwrap{
    position:relative;
    width:min(50vw,236px);
    margin-bottom:26px;
  }
  .mark{display:block;width:100%;height:auto;}

  .ring{
    position:absolute;left:50%;top:50%;
    width:76%;aspect-ratio:1/1;
    transform:translate(-50%,-50%) scale(.55);
    border-radius:50%;
    border:1.5px solid rgba(235,127,45,.55);
    opacity:0;
  }

  .scan{
    position:absolute;left:-4%;right:-4%;top:62%;height:2px;
    background:linear-gradient(90deg,rgba(235,127,45,0),var(--orange),rgba(235,127,45,0));
    opacity:0;
  }

  .name,.en{display:flex;align-items:center;justify-content:center;}
  .name{width:100%;font-size:min(15.6vw,80px);gap:0.059em;}
  .name img{display:block;height:1em;width:auto;}
  .en{width:100%;margin-top:16px;font-size:min(8.4vw,43px);gap:0.24em;}
  .en img{display:block;height:1em;width:auto;}
  .en img:nth-child(5){margin-right:0.32em;}

  .bar{
    position:relative;margin-top:34px;
    width:min(46vw,210px);height:2px;border-radius:2px;
    background:rgba(4,52,76,.1);overflow:hidden;
  }
  .bar i{
    display:block;height:100%;width:0;border-radius:2px;
    background:linear-gradient(90deg,var(--navy),var(--orange));
  }

  .play .glow{animation:glowIn 1.1s var(--ease) .1s forwards;}
  .play .mark{animation:markIn 1s var(--ease) .28s both;}
  .play .ring{animation:ring 1.15s ease-out 1.02s forwards;}
  .play .scan{animation:scan 1s var(--ease) 1.15s forwards;}
  .play .name img{animation:rise .62s var(--ease) both;
                  animation-delay:calc(1.42s + var(--i) * .09s);}
  .play .en img{animation:rise .5s var(--ease) both;
                animation-delay:calc(2.02s + var(--i) * .042s);}
  .play .bar i{animation:fill 1s var(--ease) 2.72s forwards;}
  .play .bar{animation:barOut .6s ease 3.95s forwards;}

  @keyframes glowIn{to{opacity:1;}}
  @keyframes markIn{
    from{opacity:0;clip-path:inset(0 100% 0 0);}
    45%{opacity:1;}
    to{opacity:1;clip-path:inset(0 -2% 0 0);}
  }
  @keyframes ring{
    from{opacity:.85;transform:translate(-50%,-50%) scale(.55);}
    to{opacity:0;transform:translate(-50%,-50%) scale(1.55);}
  }
  @keyframes scan{
    0%{opacity:0;transform:translateX(-30%);}
    22%{opacity:1;}
    78%{opacity:1;}
    100%{opacity:0;transform:translateX(30%);}
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(15px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes fill{to{width:100%;}}
  @keyframes barOut{to{opacity:0;}}

  @media (prefers-reduced-motion:reduce){
    .play .glow,.play .mark,.play .ring,.play .scan,
    .play .name img,.play .en img,.play .bar,.play .bar i{
      animation-duration:.01ms !important;animation-delay:0ms !important;
    }
  }
</style>
</head>
<body>

<h1 class="sr">陆柒工作室 LIUQI STUDIO</h1>

<div class="splash play" id="splash">
  <div class="glow"></div>

  <div class="markwrap">
    <div class="ring"></div>
    <img class="mark" src="mark-v1.png" alt="">
    <div class="scan"></div>
  </div>

  <div class="name">
    <img src="name-1.png" alt="" style="--i:0">
    <img src="name-2.png" alt="" style="--i:1">
    <img src="name-3.png" alt="" style="--i:2">
    <img src="name-4.png" alt="" style="--i:3">
    <img src="name-5.png" alt="" style="--i:4">
  </div>

  <div class="en">
    <img src="en-1.png" alt="" style="--i:0">
    <img src="en-2.png" alt="" style="--i:1">
    <img src="en-3.png" alt="" style="--i:2">
    <img src="en-4.png" alt="" style="--i:3">
    <img src="en-5.png" alt="" style="--i:4">
    <img src="en-6.png" alt="" style="--i:5">
    <img src="en-7.png" alt="" style="--i:6">
    <img src="en-8.png" alt="" style="--i:7">
    <img src="en-9.png" alt="" style="--i:8">
    <img src="en-10.png" alt="" style="--i:9">
    <img src="en-11.png" alt="" style="--i:10">
  </div>

  <div class="bar"><i></i></div>
</div>

<script>
(function(){
  var el = document.getElementById('splash');
  el.addEventListener('click', function(){
    el.classList.remove('play');
    void el.offsetWidth;
    el.classList.add('play');
  });
})();
</script>
</body>
</html>
