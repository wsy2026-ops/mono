        <script type="text/javascript">
          // ★ React 0.14 的 react-with-addons 是全家桶，但 UMD 只导出 window.React。
          //   它内部已经带 ReactDOM 的渲染器（React.render / unmountComponentAtNode / findDOMNode），
          //   这里给 window.ReactDOM 垫一个，避免 "ReactDOM is not defined"。
          (function () {
            if (typeof window.ReactDOM !== 'undefined') return;
            if (typeof window.React === 'undefined') return;
            window.ReactDOM = {
              render: window.React.render,
              unmountComponentAtNode: window.React.unmountComponentAtNode,
              findDOMNode: window.React.findDOMNode
            };
          })();
        </script>
        <script type="text/javascript" src="./build/browser.min.js?v=20261030r"></script>
    
    <!-- ★ 手机端适配：按屏宽等比缩放（原版固定 960px，手机上会溢出） -->
    <script>
      (function () {
        var BASE = 960;   // 必须等于设计宽度，否则内容会超出屏幕
        function fit() {
          var w = document.documentElement.clientWidth || window.innerWidth;
          var h = document.documentElement.clientHeight || window.innerHeight;
          var z = 1;
          // 窄屏（<=900）走 CSS 重排，不缩放；只有 900~960 这档才等比缩一下防溢出
          if (w > 900 && w < BASE) {
            z = w / BASE;
          }
          document.documentElement.style.zoom = z;
          document.documentElement.style.setProperty('--kubi-zoom', z);
        }
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', function () { setTimeout(fit, 120); });
        document.addEventListener('DOMContentLoaded', fit);
      })();
    </script>
