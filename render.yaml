# Render Blueprint：MONO 社区云端部署（免费档）
# 用法：Render 控制台 → New + → Blueprint → 选本仓库 → Apply
# 升级 Starter + 挂持久盘后：在面板环境变量里把 MONO_DATA_DIR 设为 /var/data
services:
  - type: web
    name: mono-community
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements-render.txt
    startCommand: python wsgi.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONO_DATA_DIR
        sync: false
      # 外部数据库连接串（Neon PostgreSQL）：填了就启用"启动自动恢复 + 定期远程快照"
      # 不填也能跑，但免费档重启后数据会清零
      - key: MONO_NEON_DSN
        sync: false
      # 本地检查间隔秒数（内容变化才真正上传，空闲时不碰数据库）
      - key: MONO_SNAPSHOT_INTERVAL
        value: "120"
