<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>中国象棋大师</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:#0b0b0d;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      color:#f0ece4;-webkit-tap-highlight-color:transparent}

    /* ── 一、工作室 ── */
    #studio{position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;
      transition:opacity .42s ease}
    #studio.out{opacity:0}
    .st-mark{font-family:"KaiTi","STKaiti","楷体",serif;font-size:44px;font-weight:700;
      letter-spacing:.42em;text-indent:.42em;
      background:linear-gradient(178deg,#F2E3BC,#B99A4E);
      -webkit-background-clip:text;background-clip:text;color:transparent}
    .st-line{width:56px;height:1px;background:linear-gradient(90deg,transparent,#B99A4E,transparent)}
    .st-sub{font-size:11px;letter-spacing:.5em;text-indent:.5em;color:#6b6459}

    /* ── 二、棋局开场 ── */
    #boot{position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:26px;
      opacity:0;pointer-events:none;transition:opacity .4s ease}
    #boot.on{opacity:1;pointer-events:auto}
    #boot.out{opacity:0}

    .bd-wrap{position:relative;width:210px;height:210px;display:grid;place-items:center}
    .bd-grid{position:absolute;inset:0;border-radius:14px;
      background:
        repeating-linear-gradient(90deg,rgba(201,162,39,.32) 0 1px,transparent 1px 23.3px),
        repeating-linear-gradient(0deg,rgba(201,162,39,.32) 0 1px,transparent 1px 21px),
        radial-gradient(circle at 50% 50%,rgba(201,162,39,.13),transparent 66%);
      border:1px solid rgba(201,162,39,.5);
      opacity:0;transform:scale(.86);
      animation:bdIn .9s cubic-bezier(.22,.9,.3,1) .15s both}
    @keyframes bdIn{to{opacity:1;transform:scale(1)}}

    .bd-seal{position:relative;width:96px;height:96px;border-radius:16px;
      display:grid;place-items:center;
      font-family:"KaiTi","STKaiti","楷体",serif;font-size:52px;font-weight:800;color:#FFF6E0;
      background:radial-gradient(circle at 34% 26%,#D0483F,#A52222 46%,#6E0F0F);
      box-shadow:inset 0 0 0 3px rgba(201,162,39,.92),0 0 0 1px rgba(0,0,0,.4),
        0 16px 40px rgba(90,20,10,.55),0 0 46px rgba(201,162,39,.35);
      opacity:0;transform:scale(2.1) translateY(-40px);
      animation:sealIn .62s cubic-bezier(.2,.85,.3,1) .55s both,
                sealGlow 2.4s ease-in-out 1.2s infinite}
    @keyframes sealIn{
      0%{opacity:0;transform:scale(2.1) translateY(-40px)}
      62%{opacity:1;transform:scale(.94) translateY(0)}
      78%{transform:scale(1.05)}
      100%{opacity:1;transform:scale(1)}
    }
    @keyframes sealGlow{
      0%,100%{box-shadow:inset 0 0 0 3px rgba(201,162,39,.92),0 0 0 1px rgba(0,0,0,.4),
        0 16px 40px rgba(90,20,10,.55),0 0 46px rgba(201,162,39,.3)}
      50%{box-shadow:inset 0 0 0 3px rgba(228,197,90,1),0 0 0 1px rgba(0,0,0,.4),
        0 16px 40px rgba(90,20,10,.55),0 0 74px rgba(201,162,39,.55)}
    }
    .bd-ring{position:absolute;width:96px;height:96px;border-radius:50%;
      border:1.5px solid rgba(228,197,90,.7);opacity:0;
      animation:ringOut 1.5s cubic-bezier(.15,.8,.3,1) .95s infinite}
    .bd-ring.b{animation-delay:1.4s}
    @keyframes ringOut{0%{opacity:.85;transform:scale(1)}
      100%{opacity:0;transform:scale(2.5)}}

    .bd-text{text-align:center}
    .bd-name{font-family:"KaiTi","STKaiti","楷体",serif;font-size:27px;font-weight:700;
      letter-spacing:.3em;text-indent:.3em;
      background:linear-gradient(178deg,#F2E3BC,#B99A4E);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      opacity:0;animation:fadeUp .6s ease 1.15s both}
    .bd-sub{margin-top:11px;font-size:10.5px;letter-spacing:.42em;text-indent:.42em;color:#6b6459;
      opacity:0;animation:fadeUp .6s ease 1.4s both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    .bd-load{margin-top:6px;width:150px;height:2px;border-radius:99px;background:rgba(201,162,39,.16);
      overflow:hidden;opacity:0;animation:fadeUp .5s ease 1.6s both}
    .bd-load i{display:block;height:100%;width:0;border-radius:99px;
      background:linear-gradient(90deg,#8C6E15,#E4C55A);
      animation:loadRun 2.6s cubic-bezier(.3,.7,.4,1) 1.7s forwards}
    @keyframes loadRun{to{width:100%}}

    #err{position:absolute;left:0;right:0;bottom:38px;text-align:center;
      font-size:12px;color:#8a8279;display:none}

    @media (prefers-reduced-motion: reduce){
      .bd-grid,.bd-seal,.bd-name,.bd-sub,.bd-load,.bd-load i{animation-duration:.01ms !important;
        animation-iteration-count:1 !important;opacity:1 !important;transform:none !important}
      .bd-ring{display:none}
    }
  </style>
</head>
<body>
  <div id="studio">
    <div class="st-mark">陆柒</div>
    <div class="st-line"></div>
    <div class="st-sub">工作室</div>
  </div>

  <div id="boot">
    <div class="bd-wrap">
      <div class="bd-grid"></div>
      <div class="bd-ring"></div>
      <div class="bd-ring b"></div>
      <div class="bd-seal">帅</div>
    </div>
    <div class="bd-text">
      <div class="bd-name">中国象棋大师</div>
      <div class="bd-sub">MONO · 国风战棋</div>
      <div class="bd-load"><i></i></div>
    </div>
  </div>

  <div id="err"></div>

  <script>
  (function(){
    var SITE     = 'https://monocraft.top/game/xqmaster';
    var SWITCH   = 1500;
    var BOOT_RUN = 3000;
    var MAX_WAIT = 9000;
    var t0 = Date.now();
    var finished = false;
    var studio = document.getElementById('studio');
    var boot = document.getElementById('boot');
    var errEl = document.getElementById('err');

    var reduce = window.matchMedia &&
                 window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var total = reduce ? 1000 : SWITCH + BOOT_RUN;

    if (!reduce){
      setTimeout(function(){
        studio.classList.add('out');
        boot.classList.add('on');
      }, SWITCH);
    } else {
      studio.style.display = 'none';
      boot.classList.add('on');
    }

    function go(){
      if (finished) return;
      finished = true;
      var wait = Math.max(0, total - (Date.now() - t0));
      setTimeout(function(){
        boot.classList.add('out');
        setTimeout(function(){ location.replace(SITE); }, 300);
      }, wait);
    }

    try {
      fetch(SITE, { mode: 'no-cors', cache: 'no-store' }).then(go).catch(go);
    } catch (e) {
      setTimeout(go, total);
    }

    setTimeout(function(){
      if (!finished){
        errEl.style.display = 'block';
        errEl.textContent = '网络好像有点慢，正在重试…';
      }
      go();
    }, MAX_WAIT);
  })();
  </script>
</body>
</html>
